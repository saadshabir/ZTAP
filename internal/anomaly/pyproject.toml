[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ztap-anomaly"
version = "0.1.0"
description = "Anomaly detection service for ZTAP (Zero Trust Access Platform)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "scikit-learn==1.9.0",
    "numpy==2.5.3",
    "joblib==1.6.0",
    "gunicorn==26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
]

[tool.setuptools]
py-modules = ["service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["test_service.py"]
addopts = "-v"
