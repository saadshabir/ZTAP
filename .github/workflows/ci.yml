name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: "0 2 * * 1"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
          # Formatters (gofmt/goimports) are not part of `golangci-lint run` in
          # v2; `fmt: true` applies them so the diff check below can gate on
          # formatting.
          fmt: true

      - name: Fail on unformatted files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git diff --stat
            echo "::error::golangci-lint fmt modified files; run 'golangci-lint fmt' locally before pushing"
            exit 1
          fi

      - name: Run shellcheck
        run: shellcheck scripts/*.sh demo.sh

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor==1.16.3 .github/workflows/

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
        with:
          args: -color

  test-go:
    name: Go Tests (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -race -timeout 10m

  test-integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run policy enforcer integration tests
        run: go test -v -timeout=60s -tags=integration ./internal/enforcer/... -run TestPolicyEnforcer

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ztap
            context: .
            file: ./Dockerfile
            tag: ztap:test

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  ebpf-verification:
    name: eBPF Verification (Linux)
    runs-on: ubuntu-24.04
    needs: [lint, test-go]
    # Forked PRs cannot run privileged eBPF steps
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make

      - name: Download dependencies
        run: go mod download

      - name: Compile eBPF program
        run: |
          make -C bpf
          sudo mkdir -p /usr/local/share/ztap/bpf
          sudo cp -v bpf/filter.o /usr/local/share/ztap/bpf/filter.o

      - name: Check generated eBPF bindings are up to date
        run: |
          go generate ./internal/enforcer/...
          git diff --exit-code -- internal/enforcer/bpf_bpfel.go internal/enforcer/bpf_bpfeb.go

      - name: Inspect eBPF object (ELF)
        run: |
          which llvm-objdump || true
          which llvm-readelf || true
          echo "ls -l built object and system path" && ls -l bpf/filter.o /usr/local/share/ztap/bpf/filter.o
          echo "readelf -S" && (llvm-readelf -S bpf/filter.o || readelf -S bpf/filter.o)
          echo "objdump -h" && (llvm-objdump -h bpf/filter.o || objdump -h bpf/filter.o)

      - name: Run eBPF integration test
        env:
          ZTAP_BPF_OBJECT: /usr/local/share/ztap/bpf/filter.o
          ZTAP_DEBUG_EBPF: "1"
        run: sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE,ZTAP_BPF_OBJECT,ZTAP_DEBUG_EBPF go test -tags integration ./internal/enforcer -run TestEBPFIntegrationLoadAndAttach -v

  build-check:
    name: Build Check (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="ztap-${GOOS}-${GOARCH}"
          go build -o "${out}" ./cmd/ztap
          ls -lh "${out}"

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-24.04
    needs:
      - lint
      - actionlint
      - zizmor
      - test-go
      - test-integration
      - docker-build
      - ebpf-verification
      - build-check
      - dependency-review
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check all jobs status
        run: |
          echo "Job Results:"
          echo "  lint: ${NEEDS_LINT_RESULT}"
          echo "  actionlint: ${NEEDS_ACTIONLINT_RESULT}"
          echo "  zizmor: ${NEEDS_ZIZMOR_RESULT}"
          echo "  test-go: ${NEEDS_TEST_GO_RESULT}"
          echo "  test-integration: ${NEEDS_TEST_INTEGRATION_RESULT}"
          echo "  docker-build: ${NEEDS_DOCKER_BUILD_RESULT}"
          echo "  ebpf-verification: ${NEEDS_EBPF_VERIFICATION_RESULT}"
          echo "  build-check: ${NEEDS_BUILD_CHECK_RESULT}"
          echo "  dependency-review: ${NEEDS_DEPENDENCY_REVIEW_RESULT}"
          echo ""

          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
            echo "Some checks failed"
            exit 1
          elif [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "Some checks were cancelled"
            exit 1
          else
            echo "All checks passed!"
          fi
        env:
          NEEDS_LINT_RESULT: ${{ needs.lint.result }}
          NEEDS_ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          NEEDS_ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          NEEDS_TEST_GO_RESULT: ${{ needs.test-go.result }}
          NEEDS_TEST_INTEGRATION_RESULT: ${{ needs.test-integration.result }}
          NEEDS_DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          NEEDS_EBPF_VERIFICATION_RESULT: ${{ needs.ebpf-verification.result }}
          NEEDS_BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          NEEDS_DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
