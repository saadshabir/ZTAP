name: Migration CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

on:
  workflow_dispatch:
  push:
    branches: [main, codex/streamline-ztap]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: "0 2 * * 1"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            echo "::error::gofmt would modify files; run 'gofmt -w' locally before pushing"
            exit 1
          fi

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor==1.16.3 .github/workflows/

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
        with:
          args: -color

  test-go:
    name: Go Tests (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -race -timeout 10m

  test-integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run eBPF engine integration tests
        run: go test -v -timeout=60s -tags=integration ./internal/enforcer/...

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ztap
            context: .
            file: ./Dockerfile
            tag: ztap:test

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  ebpf-verification:
    name: eBPF Verification (Linux)
    runs-on: ubuntu-24.04
    needs: [lint, test-go]
    # Forked PRs cannot run privileged eBPF steps
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make

      - name: Download dependencies
        run: go mod download

      - name: Check generated eBPF bindings are up to date
        env:
          BPF2GO_CC: clang-18
        run: |
          go generate ./internal/enforcer/...
          git diff --exit-code -- internal/enforcer/engine_bpfel.go internal/enforcer/engine_bpfeb.go

      - name: Verify Linux eBPF preflight and instance-owned engine
        run: |
          set -o pipefail
          sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE go test -race -tags integration -timeout=10m ./internal/enforcer -run '^TestLinuxEngine' -v 2>&1 | tee ebpf-engine-tests.txt

      - name: Upload privileged eBPF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ebpf-engine-evidence
          path: ebpf-engine-tests.txt
          if-no-files-found: error
          retention-days: 14

  capability-agent:
    name: Capability-only Agent (Kubernetes)
    runs-on: ubuntu-24.04
    needs: [lint, test-go]
    # Forked PRs cannot run the host bpffs and eBPF attach steps.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 35

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare host bpffs
        run: |
          sudo mkdir -p /sys/fs/bpf
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpffs /sys/fs/bpf
          fi

      - name: Install kind
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install sigs.k8s.io/kind@v0.32.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create disposable Kubernetes cluster
        run: |
          cat > "$RUNNER_TEMP/kind-config.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc.options]
                SystemdCgroup = true
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: KubeletConfiguration
                  apiVersion: kubelet.config.k8s.io/v1beta1
                  cgroupDriver: systemd
              extraMounts:
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  readOnly: false
                  propagation: HostToContainer
          EOF
          kind create cluster --name ztap --image kindest/node:v1.36.4 \
            --config "$RUNNER_TEMP/kind-config.yaml" --wait 180s

      - name: Build and load the agent image
        run: |
          docker build --tag ztap:v0.1.0 .
          kind load docker-image ztap:v0.1.0 --name ztap

      - name: Exercise the shipped capability-only DaemonSet
        run: |
          set -o pipefail
          exec > >(tee capability-agent-smoke.txt) 2>&1
          kubectl apply -f deployments/kubernetes/ztap-agent.yaml
          kubectl -n ztap-system rollout status daemonset/ztap-agent --timeout=180s
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ztap-smoke
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: smoke-server
            namespace: ztap-smoke
            labels:
              app: smoke-server
          spec:
            containers:
              - name: server
                image: busybox:1.36.1
                command: ["sh", "-c", "mkdir -p /www && printf 'ok\\n' > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: smoke-control
            namespace: ztap-smoke
            labels:
              app: smoke-control
          spec:
            containers:
              - name: control
                image: busybox:1.36.1
                command: ["sh", "-c", "sleep 3600"]
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: smoke-client
            namespace: ztap-smoke
            labels:
              app: smoke-client
          spec:
            containers:
              - name: client
                image: busybox:1.36.1
                command: ["sh", "-c", "sleep 3600"]
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: smoke-client-deny-egress
            namespace: ztap-smoke
          spec:
            podSelector:
              matchLabels:
                app: smoke-client
            policyTypes:
              - Egress
            egress: []
          EOF
          kubectl -n ztap-smoke wait --for=condition=Ready pod/smoke-server pod/smoke-control pod/smoke-client --timeout=180s

          agent_pod="$(kubectl -n ztap-system get pods -l app=ztap-agent -o jsonpath='{.items[0].metadata.name}')"
          server_ip="$(kubectl -n ztap-smoke get pod smoke-server -o jsonpath='{.status.podIP}')"
          test -n "$agent_pod"
          test -n "$server_ip"

          printf '%s\n' '--- agent security context ---'
          kubectl -n ztap-system get pod "$agent_pod" -o jsonpath='{.spec.containers[0].securityContext}'
          printf '\n'
          privileged="$(kubectl -n ztap-system get pod "$agent_pod" -o jsonpath='{.spec.containers[0].securityContext.privileged}')"
          allow_privilege_escalation="$(kubectl -n ztap-system get pod "$agent_pod" -o jsonpath='{.spec.containers[0].securityContext.allowPrivilegeEscalation}')"
          seccomp_type="$(kubectl -n ztap-system get pod "$agent_pod" -o jsonpath='{.spec.containers[0].securityContext.seccompProfile.type}')"
          cap_drop="$(kubectl -n ztap-system get pod "$agent_pod" -o jsonpath='{.spec.containers[0].securityContext.capabilities.drop[0]}')"
          printf 'privileged=%s allowPrivilegeEscalation=%s seccompProfile=%s drop=%s\n' \
            "$privileged" "$allow_privilege_escalation" "$seccomp_type" "$cap_drop"
          test "$privileged" = false
          test "$allow_privilege_escalation" = false
          test "$seccomp_type" = RuntimeDefault
          test "$cap_drop" = ALL
          capabilities=(BPF NET_ADMIN PERFMON SYS_RESOURCE)
          for index in "${!capabilities[@]}"; do
            capability="${capabilities[$index]}"
            cap_add="$(kubectl -n ztap-system get pod "$agent_pod" -o "jsonpath={.spec.containers[0].securityContext.capabilities.add[$index]}")"
            printf 'capability[%s]=%s\n' "$capability" "$cap_add"
            test "$cap_add" = "$capability"
          done

          kubectl -n ztap-system port-forward pod/"$agent_pod" 19090:9090 > "$RUNNER_TEMP/ztap-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          classified=0
          for ((attempt = 0; attempt < 90; attempt++)); do
            metrics="$(curl --fail --silent http://127.0.0.1:19090/metrics 2>/dev/null || true)"
            if grep -Fxq 'ztap_agent_enforcing 1' <<< "$metrics" &&
              grep -Fxq 'ztap_enforced_cgroups 1' <<< "$metrics"; then
              classified=1
              break
            fi
            sleep 2
          done
          test "$classified" -eq 1

          printf '%s\n' '--- unselected control must reach the server ---'
          control_response="$(kubectl -n ztap-smoke exec smoke-control -- wget -qO- -T 3 "http://$server_ip:8080/")"
          test "$control_response" = ok

          printf '%s\n' '--- selected client must be blocked ---'
          if kubectl -n ztap-smoke exec smoke-client -- wget -qO- -T 3 "http://$server_ip:8080/"; then
            printf '%s\n' 'selected smoke-client reached the server despite default-deny egress' >&2
            exit 1
          fi

          observed_deny=0
          for ((attempt = 0; attempt < 30; attempt++)); do
            metrics="$(curl --fail --silent http://127.0.0.1:19090/metrics 2>/dev/null || true)"
            if grep -Eq '^ztap_packet_decisions_total\{action="blocked",direction="egress",reason="default_deny"\} [1-9][0-9]*(\.0+)?$' <<< "$metrics"; then
              observed_deny=1
              break
            fi
            sleep 2
          done
          test "$observed_deny" -eq 1
          printf '%s\n' 'capability-only DaemonSet attached and enforced the smoke policy'

      - name: Capture Kubernetes diagnostics
        if: always()
        run: |
          {
            kubectl get nodes -o wide || true
            kubectl -n ztap-system get daemonset,pods -o wide || true
            kubectl -n ztap-system describe daemonset/ztap-agent || true
            kubectl -n ztap-system describe pods -l app=ztap-agent || true
            kubectl -n ztap-system logs daemonset/ztap-agent --all-containers=true --tail=1000 || true
            kubectl -n ztap-smoke get pods,networkpolicy -o wide || true
            docker exec ztap-control-plane sh -c 'printf "%s\\n" "--- node cgroup configuration ---"; cat /proc/1/cgroup; grep -E "SystemdCgroup|systemd_cgroup" /etc/containerd/config.toml || true; cat /var/lib/kubelet/config.yaml | grep -E "cgroupDriver" || true; printf "%s\\n" "--- cgroup directories ---"; find /sys/fs/cgroup -maxdepth 8 -type d -print 2>/dev/null | head -n 200 || true; printf "%s\\n" "--- containerd cgroup directories ---"; find /sys/fs/cgroup -maxdepth 8 -type d -name "*cri-containerd*" -print 2>/dev/null | head -n 80 || true'
          } > capability-agent-diagnostics.txt 2>&1

      - name: Upload capability-only agent evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capability-agent-evidence
          path: |
            capability-agent-smoke.txt
            capability-agent-diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

  build-check:
    name: Build Check (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [linux]
        goarch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="ztap-${GOOS}-${GOARCH}"
          go build -o "${out}" ./cmd/ztap
          ls -lh "${out}"

  all-checks:
    name: Required CI
    runs-on: ubuntu-24.04
    needs:
      - lint
      - actionlint
      - zizmor
      - test-go
      - test-integration
      - docker-build
      - ebpf-verification
      - capability-agent
      - build-check
      - dependency-review
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check all jobs status
        run: |
          echo "Job Results:"
          echo "  lint: ${NEEDS_LINT_RESULT}"
          echo "  actionlint: ${NEEDS_ACTIONLINT_RESULT}"
          echo "  zizmor: ${NEEDS_ZIZMOR_RESULT}"
          echo "  test-go: ${NEEDS_TEST_GO_RESULT}"
          echo "  test-integration: ${NEEDS_TEST_INTEGRATION_RESULT}"
          echo "  docker-build: ${NEEDS_DOCKER_BUILD_RESULT}"
          echo "  ebpf-verification: ${NEEDS_EBPF_VERIFICATION_RESULT}"
          echo "  capability-agent: ${NEEDS_CAPABILITY_AGENT_RESULT}"
          echo "  build-check: ${NEEDS_BUILD_CHECK_RESULT}"
          echo "  dependency-review: ${NEEDS_DEPENDENCY_REVIEW_RESULT}"
          echo ""

          if [ "${NEEDS_FAILURE}" == "true" ]; then
            echo "Some checks failed"
            exit 1
          elif [ "${NEEDS_CANCELLED}" == "true" ]; then
            echo "Some checks were cancelled"
            exit 1
          elif [ "${NEEDS_EBPF_VERIFICATION_RESULT}" == "skipped" ] && { [ "${EVENT_NAME}" != "pull_request" ] || [ "${EVENT_PR_HEAD_REPOSITORY}" == "${EVENT_REPOSITORY}" ]; }; then
            echo "The privileged eBPF verification job was skipped unexpectedly"
            exit 1
          elif [ "${NEEDS_CAPABILITY_AGENT_RESULT}" == "skipped" ] && { [ "${EVENT_NAME}" != "pull_request" ] || [ "${EVENT_PR_HEAD_REPOSITORY}" == "${EVENT_REPOSITORY}" ]; }; then
            echo "The capability-only agent job was skipped unexpectedly"
            exit 1
          else
            echo "All checks passed!"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          NEEDS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          NEEDS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          NEEDS_LINT_RESULT: ${{ needs.lint.result }}
          NEEDS_ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          NEEDS_ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          NEEDS_TEST_GO_RESULT: ${{ needs.test-go.result }}
          NEEDS_TEST_INTEGRATION_RESULT: ${{ needs.test-integration.result }}
          NEEDS_DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          NEEDS_EBPF_VERIFICATION_RESULT: ${{ needs.ebpf-verification.result }}
          NEEDS_CAPABILITY_AGENT_RESULT: ${{ needs.capability-agent.result }}
          NEEDS_BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          NEEDS_DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
