name: Migration CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

on:
  workflow_dispatch:
  push:
    branches: [main, codex/streamline-ztap]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: "0 2 * * 1"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            echo "::error::gofmt would modify files; run 'gofmt -w' locally before pushing"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run govulncheck
        run: make vulncheck

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run zizmor==1.16.3 .github/workflows/

      - name: Run zizmor (pedantic)
        run: pipx run zizmor==1.16.3 --pedantic .github/workflows/

  actionlint:
    name: Actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
        with:
          args: -color

  generated-code:
    name: Generated eBPF Code
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 make

      - name: Check generated eBPF bindings
        env:
          BPF2GO_CC: clang-18
        run: make check-generated

  test-go:
    name: Go Tests (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -race -timeout 10m

  test-integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Compile Linux integration-tag tests
        run: go test -run '^$' -timeout=60s -tags=integration ./internal/enforcer/... ./internal/cli/...

      - name: Vet Linux integration-tag packages
        run: go vet -tags=integration ./internal/enforcer/... ./internal/cli/...

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Dependency Review reads metadata for pull requests.

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate

  docker-build:
    name: Docker Build (ztap)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build ztap image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ztap:test
          cache-from: type=gha,scope=ztap
          cache-to: type=gha,mode=max,scope=ztap

      - name: Exercise containerized offline validator
        run: docker run --rm -i ztap:test validate --file - < examples/native/default-deny.yaml

      - name: Scan the built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ztap:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  ebpf-verification:
    name: eBPF Verification (Linux)
    runs-on: ubuntu-24.04
    needs: [lint, test-go]
    # Forked PRs cannot run privileged eBPF steps
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate eBPF evidence output paths
        run: |
          set -euo pipefail
          for path in ebpf-engine-tests.txt; do
            if [ -L "$path" ] || [ -e "$path" ]; then
              printf 'eBPF evidence output path must not already exist: %s\n' "$path" >&2
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 make

      - name: Download dependencies
        run: go mod download

      - name: Check generated eBPF bindings are up to date
        env:
          BPF2GO_CC: clang-18
        run: |
          go generate ./internal/enforcer/...
          git diff --exit-code -- internal/enforcer/engine_bpfel.go internal/enforcer/engine_bpfeb.go

      - name: Verify Linux eBPF and agent integration suites
        run: |
          set -euo pipefail
          sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE go test -race -tags integration -timeout=10m -v ./internal/enforcer/... ./internal/cli/... 2>&1 | tee ebpf-engine-tests.txt
          printf '%s\n' 'ebpf_engine_runtime_gate=passed' >> ebpf-engine-tests.txt

      - name: Upload privileged eBPF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ebpf-engine-evidence
          path: ebpf-engine-tests.txt
          if-no-files-found: error
          retention-days: 14

  capability-agent:
    name: Capability-only Agent (Kubernetes)
    runs-on: ubuntu-24.04
    needs: [lint, test-go]
    # Forked PRs cannot run the host bpffs and eBPF attach steps.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 35

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate capability-agent evidence output paths
        run: |
          set -euo pipefail
          for path in \
            capability-agent-smoke.txt \
            capability-agent-diagnostics.txt \
            capability-agent-reference-fixture.txt \
            phase5-reference-fixture.yaml \
            capability-agent-resource.txt \
            rolling-fail-open-evidence.txt; do
            if [ -L "$path" ] || [ -e "$path" ]; then
              printf 'capability-agent evidence output path must not already exist: %s\n' "$path" >&2
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare host bpffs
        run: |
          sudo mkdir -p /sys/fs/bpf
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpffs /sys/fs/bpf
          fi

      - name: Install kind
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install sigs.k8s.io/kind@v0.32.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create disposable Kubernetes cluster
        run: |
          cat > "$RUNNER_TEMP/kind-config.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.runc.options]
                SystemdCgroup = true
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: KubeletConfiguration
                  apiVersion: kubelet.config.k8s.io/v1beta1
                  cgroupDriver: systemd
                  maxPods: 300
                - |
                  kind: ClusterConfiguration
                  apiVersion: kubeadm.k8s.io/v1beta4
                  controllerManager:
                    extraArgs:
                      - name: node-cidr-mask-size-ipv4
                        value: "23"
              extraMounts:
                - hostPath: /sys/fs/bpf
                  containerPath: /sys/fs/bpf
                  readOnly: false
                  propagation: HostToContainer
          EOF
          kind create cluster --name ztap --image kindest/node:v1.36.4 \
            --config "$RUNNER_TEMP/kind-config.yaml" --wait 180s

      - name: Disable kindnet NetworkPolicy enforcement
        run: |
          set -euo pipefail
          policy_count="$(kubectl get networkpolicies.networking.k8s.io --all-namespaces -o json | jq '.items | length')"
          test "$policy_count" -eq 0
          kubectl -n kube-system rollout status daemonset/kindnet --timeout=180s
          cni_config="$(docker exec ztap-control-plane find /etc/cni/net.d -maxdepth 1 -type f \
            \( -name '*.conf' -o -name '*.conflist' \) -print -quit)"
          test -n "$cni_config"
          kubectl -n kube-system delete daemonset kindnet --wait=true
          kindnet_pods=1
          for ((attempt = 0; attempt < 180; attempt++)); do
            kindnet_pods="$(kubectl -n kube-system get pods -o json | jq '[
              .items[]
              | select(any(.metadata.ownerReferences[]?; .kind == "DaemonSet" and .name == "kindnet"))
            ] | length')"
            if [ "$kindnet_pods" -eq 0 ]; then
              break
            fi
            sleep 1
          done
          test "$kindnet_pods" -eq 0
          docker exec ztap-control-plane test -s "$cni_config"
          node="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          kubectl wait --for=condition=Ready "node/$node" --timeout=60s
          printf 'kindnet_networkpolicy_controller=disabled\n'
          printf 'kindnet_cni_config_retained=%s\n' "$cni_config"
          printf 'ZTAP_KINDNET_NETWORKPOLICY_DISABLED=1\n' >> "$GITHUB_ENV"

      - name: Verify reference node pod capacity
        run: |
          set -euo pipefail
          node="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          pod_capacity="$(kubectl get node "$node" -o jsonpath='{.status.capacity.pods}')"
          pod_cidr="$(kubectl get node "$node" -o jsonpath='{.spec.podCIDR}')"
          printf 'reference_node_pod_capacity=%s\n' "$pod_capacity"
          printf 'reference_node_pod_cidr=%s\n' "$pod_cidr"
          test "$pod_capacity" -ge 300
          test "${pod_cidr##*/}" -eq 23

      - name: Constrain the kind reference node to two CPUs
        run: |
          set -euo pipefail
          docker update --cpus=2 ztap-control-plane
          cpu_max="$(docker exec ztap-control-plane cat /sys/fs/cgroup/cpu.max)"
          printf 'reference_cpu_max=%s\n' "$cpu_max"
          test "$cpu_max" = '200000 100000'

      - name: Build and load the agent image
        run: |
          docker build --tag ztap:v0.1.0 .
          kind load docker-image ztap:v0.1.0 --name ztap

      - name: Exercise the shipped capability-only DaemonSet
        run: |
          set -euo pipefail
          (
          set -euo pipefail
          test "${ZTAP_KINDNET_NETWORKPOLICY_DISABLED:-}" = 1
          printf '%s\n' 'kindnet_networkpolicy_controller=disabled'
          kubectl apply -f deployments/kubernetes/ztap-agent.yaml
          kubectl -n ztap-system rollout status daemonset/ztap-agent --timeout=180s
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ztap-smoke
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: smoke-server
            namespace: ztap-smoke
            labels:
              app: smoke-server
          spec:
            containers:
              - name: server
                image: busybox:1.36.1
                command: ["sh", "-c", "mkdir -p /www && printf 'ok\\n' > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: smoke-server
            namespace: ztap-smoke
          spec:
            type: ClusterIP
            selector:
              app: smoke-server
            ports:
              - name: http
                protocol: TCP
                port: 8080
                targetPort: 8080
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: smoke-control
            namespace: ztap-smoke
            labels:
              app: smoke-control
          spec:
            containers:
              - name: control
                image: busybox:1.36.1
                command: ["sh", "-c", "sleep 3600"]
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: smoke-client
            namespace: ztap-smoke
            labels:
              app: smoke-client
          spec:
            containers:
              - name: client
                image: busybox:1.36.1
                command: ["sh", "-c", "sleep 3600"]
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: smoke-client-deny-egress
            namespace: ztap-smoke
          spec:
            podSelector:
              matchLabels:
                app: smoke-client
            policyTypes:
              - Egress
            egress: []
          EOF
          kubectl -n ztap-smoke wait --for=condition=Ready pod/smoke-server pod/smoke-control pod/smoke-client --timeout=180s

          agent_pods="$(kubectl -n ztap-system get pods -l app=ztap-agent -o json)"
          agent_pod="$(jq -r '
            [
              .items[]
              | select(.status.phase == "Running")
              | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
              | .metadata.name
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$agent_pods")"
          server_ip="$(kubectl -n ztap-smoke get pod smoke-server -o jsonpath='{.status.podIP}')"
          service_ip="$(kubectl -n ztap-smoke get service smoke-server -o jsonpath='{.spec.clusterIP}')"
          test -n "$agent_pod"
          test -n "$server_ip"
          test -n "$service_ip"
          test "$service_ip" != None
          service_endpoint_ip=
          for ((attempt = 0; attempt < 30; attempt++)); do
            service_endpoint_ip="$(kubectl -n ztap-smoke get endpoints smoke-server -o jsonpath='{.subsets[*].addresses[*].ip}')"
            if [ "$service_endpoint_ip" = "$server_ip" ]; then
              break
            fi
            sleep 1
          done
          test "$service_endpoint_ip" = "$server_ip"
          printf 'service_cluster_ip=%s\nservice_backend_pod_ip=%s\n' "$service_ip" "$server_ip"

          printf '%s\n' '--- agent security context ---'
          agent_json="$(kubectl -n ztap-system get pod "$agent_pod" -o json)"
          jq -e '
            (.spec.hostNetwork // false) == false and
            (.spec.hostPID // false) == false and
            (.spec.hostIPC // false) == false and
            (.spec.containers | length) == 1 and
            .spec.containers[0].securityContext.runAsUser == 0 and
            .spec.containers[0].securityContext.runAsGroup == 0 and
            .spec.containers[0].securityContext.privileged == false and
            .spec.containers[0].securityContext.allowPrivilegeEscalation == false and
            .spec.containers[0].securityContext.readOnlyRootFilesystem == true and
            .spec.containers[0].securityContext.seccompProfile.type == "RuntimeDefault" and
            (.spec.containers[0].securityContext.capabilities.drop | sort) == ["ALL"] and
            (.spec.containers[0].securityContext.capabilities.add | sort) == ["BPF", "NET_ADMIN", "PERFMON", "SYS_RESOURCE"] and
            any(.spec.containers[0].volumeMounts[]?;
              .name == "cgroup" and
              .mountPath == "/host/sys/fs/cgroup" and
              .readOnly == true)
          ' <<< "$agent_json" >/dev/null
          printf '%s\n' 'host namespace isolation and read-only cgroup mount verified'
          printf 'agent_security_context_json=%s\n' "$(jq -c '.spec.containers[0].securityContext' <<< "$agent_json")"
          printf '\n'
          privileged="$(jq -r '.spec.containers[0].securityContext.privileged' <<< "$agent_json")"
          allow_privilege_escalation="$(jq -r '.spec.containers[0].securityContext.allowPrivilegeEscalation' <<< "$agent_json")"
          seccomp_type="$(jq -r '.spec.containers[0].securityContext.seccompProfile.type' <<< "$agent_json")"
          cap_drop="$(jq -r '.spec.containers[0].securityContext.capabilities.drop[0]' <<< "$agent_json")"
          printf 'privileged=%s allowPrivilegeEscalation=%s seccompProfile=%s drop=%s\n' \
            "$privileged" "$allow_privilege_escalation" "$seccomp_type" "$cap_drop"
          test "$privileged" = false
          test "$allow_privilege_escalation" = false
          test "$seccomp_type" = RuntimeDefault
          test "$cap_drop" = ALL
          capabilities=(BPF NET_ADMIN PERFMON SYS_RESOURCE)
          for index in "${!capabilities[@]}"; do
            capability="${capabilities[$index]}"
            cap_add="$(jq -r --argjson index "$index" '.spec.containers[0].securityContext.capabilities.add[$index]' <<< "$agent_json")"
            printf 'capability[%s]=%s\n' "$capability" "$cap_add"
            test "$cap_add" = "$capability"
          done

          kubectl -n ztap-system port-forward pod/"$agent_pod" 19090:9090 > "$RUNNER_TEMP/ztap-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          read_uint_metric() {
            local metric="$1"
            local text="$2"
            local value
            value="$(awk -v metric="$metric" '
              {
                sample=$1
                base=sample
                sub(/\{.*$/, "", base)
              }
              base == metric {
                matches++
                if (sample != metric || NF != 2 || $2 !~ /^[0-9]+$/ || matches > 1) {
                  invalid=1
                } else {
                  value=$2
                }
              }
              END {
                if (invalid || matches != 1) {
                  exit 1
                }
                print value
              }
            ' <<< "$text")" || {
              printf 'smoke probe failed: metrics must contain exactly one unsigned %s sample\n' "$metric" >&2
              return 1
            }
            printf '%s\n' "$value"
          }
          read_counter_metric() {
            local metric="$1"
            local text="$2"
            local value
            if value="$(awk -v specification="$metric" '
              BEGIN {
                part_count = split(specification, parts, "{")
                expected_base = parts[1]
                expected_count = 0
                if (part_count > 1) {
                  label_text = parts[2]
                  sub(/}$/, "", label_text)
                  expected_count = split(label_text, expected_pairs, ",")
                  for (i = 1; i <= expected_count; i++) {
                    separator = index(expected_pairs[i], "=")
                    if (separator == 0) {
                      invalid = 1
                      continue
                    }
                    expected_name = substr(expected_pairs[i], 1, separator - 1)
                    expected_value = substr(expected_pairs[i], separator + 1)
                    if (expected_name == "" || expected_name in expected_labels) {
                      invalid = 1
                    }
                    expected_names[i] = expected_name
                    expected_labels[expected_name] = expected_value
                  }
                }
              }
              {
                sample=$1
                base=sample
                sub(/\{.*$/, "", base)
              }
              base == expected_base {
                actual_label_text=sample
                sub(/^[^{]*\{/, "", actual_label_text)
                if (actual_label_text == sample) {
                  next
                }
                sub(/}$/, "", actual_label_text)
                actual_count=split(actual_label_text, actual_pairs, ",")
                if (actual_count != expected_count) {
                  next
                }
                for (name in actual_labels) {
                  delete actual_labels[name]
                }
                candidate=1
                for (i = 1; i <= actual_count; i++) {
                  separator=index(actual_pairs[i], "=")
                  if (separator == 0) {
                    candidate=0
                    continue
                  }
                  actual_name=substr(actual_pairs[i], 1, separator - 1)
                  actual_value=substr(actual_pairs[i], separator + 1)
                  if (actual_name == "" || actual_name in actual_labels) {
                    candidate=0
                  }
                  actual_labels[actual_name]=actual_value
                  if (!(actual_name in expected_labels) || expected_labels[actual_name] != actual_value) {
                    candidate=0
                  }
                }
                for (i = 1; i <= expected_count; i++) {
                  if (!(expected_names[i] in actual_labels)) {
                    candidate=0
                  }
                }
                if (!candidate) {
                  next
                }
                matches++
                if (matches > 1) {
                  invalid=1
                  next
                }
                if (NF != 2 || $2 !~ /^[0-9]+(\.0+)?$/) {
                  invalid=1
                } else {
                  value=$2
                }
              }
              END {
                if (matches == 0) {
                  exit 2
                }
                if (invalid) {
                  exit 1
                }
                sub(/\..*$/, "", value)
                print value
              }
            ' <<< "$text")"; then
              printf '%s\n' "$value"
              return 0
            else
              local status=$?
              if [ "$status" -eq 2 ]; then
                return 2
              fi
              printf 'smoke probe failed: metrics must contain exactly one unsigned %s sample\n' "$metric" >&2
              return 1
            fi
          }
          wait_for_policy_epoch_after() {
            local previous_epoch="$1"
            local current_epoch
            local updated=0
            for ((attempt = 0; attempt < 30; attempt++)); do
              metrics="$(curl --fail --silent http://127.0.0.1:19090/metrics 2>/dev/null || true)"
              if [ -n "$metrics" ] && current_epoch="$(read_uint_metric ztap_active_policy_epoch "$metrics")"; then
                if [ "$current_epoch" -gt "$previous_epoch" ]; then
                  updated=1
                  break
                fi
              fi
              sleep 2
            done
            if [ "$updated" -ne 1 ]; then
              printf 'smoke probe failed: active policy epoch did not advance beyond %s\n' "$previous_epoch" >&2
              return 1
            fi
            printf '%s\n' "$current_epoch"
          }
          classified=0
          for ((attempt = 0; attempt < 90; attempt++)); do
            metrics="$(curl --fail --silent http://127.0.0.1:19090/metrics 2>/dev/null || true)"
            if [ -z "$metrics" ]; then
              sleep 2
              continue
            fi
            if ! agent_enforcing="$(read_uint_metric ztap_agent_enforcing "$metrics")"; then
              exit 1
            fi
            if ! enforced="$(read_uint_metric ztap_enforced_cgroups "$metrics")"; then
              exit 1
            fi
            if ! active_policy_epoch="$(read_uint_metric ztap_active_policy_epoch "$metrics")"; then
              exit 1
            fi
            if [ "$agent_enforcing" -eq 1 ] &&
              [ "$enforced" -eq 1 ] &&
              [ "$active_policy_epoch" -ge 1 ]; then
              classified=1
              break
            fi
            sleep 2
          done
          test "$classified" -eq 1

          health="$(curl --fail --silent http://127.0.0.1:19090/healthz)"
          jq -e '.status == "ok" and (.version | type == "string") and (.version | length > 0)' <<< "$health" >/dev/null
          ready="$(curl --fail --silent http://127.0.0.1:19090/readyz)"
          jq -e '.status == "ready" and .ready == true and .enforcing == true and .reason == "ok"' <<< "$ready" >/dev/null
          for endpoint in healthz readyz metrics; do
            method_headers="$RUNNER_TEMP/ztap-status-${endpoint}.headers"
            method_status="$(curl --silent --dump-header "$method_headers" --output /dev/null --write-out '%{http_code}' --request POST "http://127.0.0.1:19090/$endpoint")"
            test "$method_status" = 405
            method_allow="$(awk 'tolower($1) == "allow:" { gsub("\r", "", $2); print $2; exit }' "$method_headers")"
            test "$method_allow" = GET
          done
          printf '%s\n' 'status_endpoints=passed'

          printf '%s\n' '--- unselected control must reach the server ---'
          control_response="$(kubectl -n ztap-smoke exec smoke-control -- wget -qO- -T 3 "http://$server_ip:8080/")"
          test "$control_response" = ok
          control_service_response="$(kubectl -n ztap-smoke exec smoke-control -- wget -qO- -T 3 "http://$service_ip:8080/")"
          test "$control_service_response" = ok

          printf '%s\n' '--- selected client must be blocked ---'
          if kubectl -n ztap-smoke exec smoke-client -- wget -qO- -T 3 "http://$server_ip:8080/"; then
            printf '%s\n' 'selected smoke-client reached the server despite default-deny egress' >&2
            exit 1
          fi

          observed_deny=0
          packet_decisions_blocked_default_deny=
          for ((attempt = 0; attempt < 30; attempt++)); do
            metrics="$(curl --fail --silent http://127.0.0.1:19090/metrics 2>/dev/null || true)"
            if packet_decisions_blocked_default_deny="$(read_counter_metric 'ztap_packet_decisions_total{action="blocked",direction="egress",reason="default_deny"}' "$metrics")"; then
              if [ "$packet_decisions_blocked_default_deny" -gt 0 ]; then
                observed_deny=1
                break
              fi
            else
              metric_status=$?
              if [ "$metric_status" -ne 2 ]; then
                exit "$metric_status"
              fi
            fi
            sleep 2
          done
          test "$observed_deny" -eq 1
          printf 'packet_decisions_blocked_default_deny=%s\n' "$packet_decisions_blocked_default_deny"

          printf '%s\n' '--- selector peer permits only the backend PodIP, not the Service frontend ---'
          previous_policy_epoch="$active_policy_epoch"
          kubectl apply -f - <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: smoke-client-deny-egress
            namespace: ztap-smoke
          spec:
            podSelector:
              matchLabels:
                app: smoke-client
            policyTypes:
              - Egress
            egress:
              - to:
                  - podSelector:
                      matchLabels:
                        app: smoke-server
                ports:
                  - protocol: TCP
                    port: 8080
          EOF
          active_policy_epoch="$(wait_for_policy_epoch_after "$previous_policy_epoch")"
          printf 'selector_peer_policy_epoch=%s\n' "$active_policy_epoch"
          selector_pod_response="$(kubectl -n ztap-smoke exec smoke-client -- wget -qO- -T 3 "http://$server_ip:8080/")"
          test "$selector_pod_response" = ok
          printf '%s\n' 'selector_peer_direct_podip=allowed'
          if kubectl -n ztap-smoke exec smoke-client -- wget -qO- -T 3 "http://$service_ip:8080/"; then
            printf '%s\n' 'selector peer unexpectedly allowed Service ClusterIP access' >&2
            exit 1
          fi
          printf '%s\n' 'selector_peer_service_clusterip=blocked'

          printf '%s\n' '--- explicit ClusterIP ipBlock permits the Service frontend, not the backend PodIP ---'
          previous_policy_epoch="$active_policy_epoch"
          kubectl apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: smoke-client-deny-egress
            namespace: ztap-smoke
          spec:
            podSelector:
              matchLabels:
                app: smoke-client
            policyTypes:
              - Egress
            egress:
              - to:
                  - ipBlock:
                      cidr: ${service_ip}/32
                ports:
                  - protocol: TCP
                    port: 8080
          EOF
          active_policy_epoch="$(wait_for_policy_epoch_after "$previous_policy_epoch")"
          printf 'explicit_clusterip_policy_epoch=%s\nexplicit_clusterip_ipblock_cidr=%s/32\n' \
            "$active_policy_epoch" "$service_ip"
          explicit_service_response="$(kubectl -n ztap-smoke exec smoke-client -- wget -qO- -T 3 "http://$service_ip:8080/")"
          test "$explicit_service_response" = ok
          printf '%s\n' 'explicit_clusterip_ipblock_service=allowed'
          if kubectl -n ztap-smoke exec smoke-client -- wget -qO- -T 3 "http://$server_ip:8080/"; then
            printf '%s\n' 'explicit ClusterIP ipBlock unexpectedly allowed direct backend PodIP access' >&2
            exit 1
          fi
          printf '%s\n' 'explicit_clusterip_ipblock_podip=blocked'
          printf '%s\n' 'capability-only DaemonSet attached and enforced the smoke policy'
          ) 2>&1 | tee capability-agent-smoke.txt

      - name: Create Phase 5 reference fixture
        run: |
          set -euo pipefail
          (
          set -euo pipefail
          fixture="$RUNNER_TEMP/phase5-reference-fixture.yaml"
          reference_pods=250
          reference_policies=25
          test $((reference_pods % reference_policies)) -eq 0
          pods_per_policy=$((reference_pods / reference_policies))
          peers_per_policy=10
          reference_rules=$((reference_policies * pods_per_policy * peers_per_policy))
          test "$reference_rules" -eq 2500
          {
            cat <<'EOF'
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ztap-performance
          EOF
            for ((index = 0; index < reference_pods; index++)); do
              bucket=$((index / pods_per_policy))
              printf '%s\n' '---'
              printf 'apiVersion: v1\nkind: Pod\nmetadata:\n  name: reference-pod-%03d\n  namespace: ztap-performance\n  labels:\n    phase5-bucket: "%02d"\nspec:\n  containers:\n    - name: workload\n      image: busybox:1.36.1\n      imagePullPolicy: IfNotPresent\n      command: ["sh", "-c", "sleep 3600"]\n' \
                "$index" "$bucket"
            done
            for ((policy = 0; policy < reference_policies; policy++)); do
              printf '%s\n' '---'
              printf 'apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: reference-policy-%02d\n  namespace: ztap-performance\n  labels:\n    phase5-bucket: "%02d"\nspec:\n  podSelector:\n    matchLabels:\n      phase5-bucket: "%02d"\n  policyTypes:\n    - Egress\n  egress:\n    - to:\n' "$policy" "$policy" "$policy"
              for ((peer = 0; peer < peers_per_policy; peer++)); do
                printf '        - ipBlock:\n            cidr: 198.18.%d.%d/32\n' "$policy" "$peer"
              done
              printf '%s\n' '      ports:' '        - protocol: TCP' '          port: 10000'
            done
          } > "$fixture"
          policy_fixture="$RUNNER_TEMP/phase5-reference-policies.yaml"
          awk '/^apiVersion: networking\.k8s\.io\/v1$/ { seen=1 } seen { print }' \
            "$fixture" > "$policy_fixture"
          test "$(grep -c '^kind: NetworkPolicy$' "$policy_fixture")" -eq "$reference_policies"
          docker run --rm -i ztap:v0.1.0 validate --file - < "$policy_fixture"
          kubectl apply --dry-run=client -f "$fixture" >/dev/null
          test "$(grep -c '^kind: Pod$' "$fixture")" -eq "$reference_pods"
          test "$(grep -c '^kind: NetworkPolicy$' "$fixture")" -eq "$reference_policies"
          test "$(grep -c '^[[:space:]]*cidr: 198\.18\.' "$fixture")" -eq "$((reference_policies * peers_per_policy))"
          printf 'offline_fixture_shape=pods=%s policies=%s compiled_rules=%s\n' \
            "$reference_pods" "$reference_policies" "$reference_rules"
          cp "$fixture" phase5-reference-fixture.yaml
          kubectl apply -f "$fixture"
          kubectl -n ztap-performance wait --for=condition=Ready pod --all --timeout=300s
          test "$(kubectl -n ztap-performance get pods --no-headers | wc -l | tr -d ' ')" -eq "$reference_pods"
          test "$(kubectl -n ztap-performance get networkpolicies --no-headers | wc -l | tr -d ' ')" -eq "$reference_policies"
          live_pods="$(kubectl -n ztap-performance get pods -o json)"
          jq -e --argjson expected_pods "$reference_pods" --argjson expected_policies "$reference_policies" '
            . as $root
            | ($root.items | length == $expected_pods)
            and (
              $root.items
              | (map(.metadata.name) | sort) ==
                ([range(0; $expected_pods) | "reference-pod-\(("000" + tostring)[-3:])"] | sort)
            )
            and (
              $root.items
              | all(.[];
                  .status.phase == "Running" and
                  any(.status.conditions[]?; .type == "Ready" and .status == "True") and
                  (.status.containerStatuses | length) == 1 and
                  .status.containerStatuses[0].ready == true
                )
            )
            and (
              $root.items
              | (map(.metadata.uid) | map(select(type == "string" and length > 0)) | unique | length) == $expected_pods
            )
            and (
              $root.items
              | (map(.metadata.labels["phase5-bucket"]) | sort | group_by(.) | all(.[]; length == 10))
            )
            and (
              $root.items
              | (map(.metadata.labels["phase5-bucket"]) | unique | sort) ==
                ([range(0; $expected_policies) | (("00" + tostring)[-2:])] | sort)
            )
          ' <<< "$live_pods" >/dev/null
          live_policies="$(kubectl -n ztap-performance get networkpolicies -o json)"
          jq -e --argjson expected_policies "$reference_policies" --argjson expected_peers "$peers_per_policy" '
            . as $root
            | ($root.items | length == $expected_policies)
            and (
              $root.items
              | (map(.metadata.name) | sort) ==
                ([range(0; $expected_policies) | "reference-policy-\(("00" + tostring)[-2:])"] | sort)
            )
            and (
              $root.items
              | all(.[];
                  (.metadata.labels["phase5-bucket"] | type == "string") and
                  (.spec | keys | sort == ["egress", "podSelector", "policyTypes"]) and
                  (.spec.policyTypes == ["Egress"]) and
                  (.spec.podSelector | keys | sort == ["matchLabels"]) and
                  (.spec.podSelector.matchLabels | keys | sort == ["phase5-bucket"]) and
                  (.spec.podSelector.matchLabels["phase5-bucket"] == .metadata.labels["phase5-bucket"]) and
                  (.spec.egress | length == 1) and
                  (.spec.egress[0] | keys | sort == ["ports", "to"]) and
                  (.spec.egress[0].ports |
                    (length == 1 and
                     .[0].protocol == "TCP" and
                     .[0].port == 10000 and
                     (.[0] | keys | sort == ["port", "protocol"]))) and
                  (.spec.egress[0].to |
                    (length == $expected_peers and
                     all(.[];
                       (keys | sort == ["ipBlock"]) and
                       (.ipBlock | keys | sort == ["cidr"]) and
                       (.ipBlock.cidr | test("^198\\.18\\.[0-9]+\\.[0-9]+/32$")))))
                )
            )
          ' <<< "$live_policies" >/dev/null
          printf '%s\n' 'fixture_live_shape=verified'
          printf 'fixture_shape=pods=%s policies=%s pods_per_policy=%s peers_per_policy=%s compiled_rules=%s\n' \
            "$reference_pods" "$reference_policies" "$pods_per_policy" "$peers_per_policy" "$reference_rules"
          kubectl -n ztap-performance get pods -o wide
          kubectl -n ztap-performance get networkpolicies
          ) 2>&1 | tee capability-agent-reference-fixture.txt

      - name: Sample capability-only agent resources
        run: |
          set -euo pipefail
          (
          set -euo pipefail
          expected_pods=250
          expected_policies=25
          expected_rules=2500
          retained_smoke_client_cgroups=1
          retained_smoke_client_rules=1
          expected_enforced_cgroups=$((expected_pods + retained_smoke_client_cgroups))
          expected_total_rules=$((expected_rules + retained_smoke_client_rules))
          agent_pods="$(kubectl -n ztap-system get pods -l app=ztap-agent -o json)"
          agent_pod="$(jq -r '
            [
              .items[]
              | select(.status.phase == "Running")
              | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
              | .metadata.name
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$agent_pods")"
          observed_pods="$(kubectl -n ztap-performance get pods --no-headers | wc -l | tr -d ' ')"
          observed_policies="$(kubectl -n ztap-performance get networkpolicies --no-headers | wc -l | tr -d ' ')"
          test "$observed_pods" -eq "$expected_pods"
          test "$observed_policies" -eq "$expected_policies"
          printf 'observed_fixture_pods=%s\nobserved_fixture_policies=%s\n' \
            "$observed_pods" "$observed_policies"
          cpu_max="$(docker exec ztap-control-plane cat /sys/fs/cgroup/cpu.max)"
          printf 'reference_cpu_max=%s\n' "$cpu_max"
          test "$cpu_max" = '200000 100000'
          kubectl -n ztap-system port-forward pod/"$agent_pod" 19091:9090 > "$RUNNER_TEMP/ztap-resource-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          read_uint_metric() {
            local metric="$1"
            local text="$2"
            local value
            value="$(awk -v metric="$metric" '
              {
                sample=$1
                base=sample
                sub(/\{.*$/, "", base)
              }
              base == metric {
                matches++
                if (sample != metric || NF != 2 || $2 !~ /^[0-9]+$/ || matches > 1) {
                  invalid=1
                } else {
                  value=$2
                }
              }
              END {
                if (invalid || matches != 1) {
                  exit 1
                }
                print value
              }
            ' <<< "$text")" || {
              printf 'resource sample failed: metrics must contain exactly one unsigned %s sample\n' "$metric" >&2
              return 1
            }
            printf '%s\n' "$value"
          }
          reference_ready=0
          for ((attempt = 0; attempt < 180; attempt++)); do
            metrics="$(curl --fail --silent http://127.0.0.1:19091/metrics 2>/dev/null || true)"
            if [ -z "$metrics" ]; then
              sleep 2
              continue
            fi
            if ! agent_enforcing="$(read_uint_metric ztap_agent_enforcing "$metrics")"; then
              exit 1
            fi
            if ! enforced="$(read_uint_metric ztap_enforced_cgroups "$metrics")"; then
              exit 1
            fi
            if ! rules="$(read_uint_metric ztap_compiled_rules "$metrics")"; then
              exit 1
            fi
            if ! active_policy_epoch="$(read_uint_metric ztap_active_policy_epoch "$metrics")"; then
              exit 1
            fi
            if [ "$agent_enforcing" -eq 1 ] &&
              [ "$enforced" -eq "$expected_enforced_cgroups" ] &&
              [ "$rules" -eq "$expected_total_rules" ] &&
              [ "$active_policy_epoch" -ge 1 ]; then
              fixture_enforced_cgroups=$((enforced - retained_smoke_client_cgroups))
              test "$fixture_enforced_cgroups" -eq "$expected_pods"
              fixture_compiled_rules=$((rules - retained_smoke_client_rules))
              test "$fixture_compiled_rules" -eq "$expected_rules"
              reference_ready=1
              printf 'reference_fixture_agent_enforcing=%s\nreference_fixture_active_policy_epoch=%s\nreference_total_enforced_cgroups=%s\nretained_smoke_client_cgroups=%s\nreference_fixture_enforced_cgroups=%s\nreference_total_compiled_rules=%s\nretained_smoke_client_rules=%s\nreference_fixture_compiled_rules=%s\n' \
                "$agent_enforcing" "$active_policy_epoch" "$enforced" "$retained_smoke_client_cgroups" \
                "$fixture_enforced_cgroups" "$rules" "$retained_smoke_client_rules" "$fixture_compiled_rules"
              break
            fi
            sleep 2
          done
          test "$reference_ready" -eq 1
          printf '%s\n' 'reference_fixture_status=active_waiting_for_quiet_interval'
          sleep 10
          container_ref="$(kubectl -n ztap-system get pod "$agent_pod" -o jsonpath='{.status.containerStatuses[0].containerID}')"
          container_id="${container_ref#containerd://}"
          case "$container_id" in
            ''|*[!0-9a-fA-F]*)
              printf 'resource sample failed: container ID is not hexadecimal: %s\n' "$container_id" >&2
              exit 1
              ;;
          esac
          if [ "${#container_id}" -ne 64 ]; then
            printf 'resource sample failed: container ID must contain exactly 64 hex characters: %s\n' "$container_id" >&2
            exit 1
          fi
          cgroup_name="cri-containerd-${container_id}.scope"
          cgroup_path=''
          for hierarchy in \
            /sys/fs/cgroup/kubepods.slice \
            /sys/fs/cgroup/kubelet.slice/kubelet-kubepods.slice; do
            if ! docker exec ztap-control-plane test -d "$hierarchy"; then
              continue
            fi
            candidate="$(docker exec ztap-control-plane find "$hierarchy" -type d -name "$cgroup_name" -print -quit)"
            if [ -n "$candidate" ]; then
              if [ -n "$cgroup_path" ] && [ "$cgroup_path" != "$candidate" ]; then
                printf '%s\n' 'resource sample failed: container ID matched multiple supported cgroup hierarchies' >&2
                exit 1
              fi
              cgroup_path="$candidate"
            fi
          done
          printf 'agent_namespace=ztap-system\nagent_pod=%s\ncontainer_id=%s\ncgroup_path=%s\n' \
            "$agent_pod" "$container_id" "$cgroup_path"
          if [ -z "$cgroup_path" ]; then
            printf '%s\n' 'resource sample failed: container cgroup path was not visible in the kind node'
            exit 1
          fi
          case "$cgroup_path" in
            /sys/fs/cgroup/kubepods.slice/*|/sys/fs/cgroup/kubelet.slice/kubelet-kubepods.slice/*)
              if [ "${cgroup_path##*/}" != "$cgroup_name" ]; then
                printf 'resource sample failed: cgroup path does not end in the measured container ID: %s\n' "$cgroup_path" >&2
                exit 1
              fi
              ;;
            *)
              printf 'resource sample failed: cgroup path is outside a supported containerd hierarchy: %s\n' "$cgroup_path" >&2
              exit 1
              ;;
          esac
          if ! docker exec ztap-control-plane test -r "$cgroup_path/cpu.stat" ||
            ! docker exec ztap-control-plane test -r "$cgroup_path/memory.current"; then
            printf '%s\n' 'resource sample failed: container cgroup counters were not readable'
            exit 1
          fi

          read_cpu_usec() {
            docker exec ztap-control-plane cat "$cgroup_path/cpu.stat" |
              awk '$1 == "usage_usec" { print $2 }'
          }
          read_memory_current_bytes() {
            docker exec ztap-control-plane cat "$cgroup_path/memory.current"
          }
          require_uint() {
            local name="$1"
            local value="$2"
            case "$value" in
              ''|*[!0-9]*)
                printf 'resource sample failed: %s is not an unsigned integer: %s\n' "$name" "$value" >&2
                exit 1
                ;;
            esac
          }
          max_cpu=0
          max_memory_current=0
          previous_end_cpu=''
          memory_peak_sample_interval_ns=100000000
          for sample in 1 2 3; do
            start_cpu="$(read_cpu_usec)"
            start_ns="$(date +%s%N)"
            start_memory_current="$(read_memory_current_bytes)"
            if [ -z "$start_cpu" ] || [ -z "$start_memory_current" ]; then
              printf '%s\n' 'resource sample failed: cgroup counters were empty'
              exit 1
            fi
            require_uint start_cpu_usec "$start_cpu"
            require_uint start_memory_current_bytes "$start_memory_current"
            memory_peak="$start_memory_current"
            sample_deadline_ns=$((start_ns + 5000000000))
            while :; do
              now_ns="$(date +%s%N)"
              if [ "$now_ns" -ge "$sample_deadline_ns" ]; then
                break
              fi
              remaining_ns=$((sample_deadline_ns - now_ns))
              sleep_seconds="$(awk -v remaining="$remaining_ns" -v interval="$memory_peak_sample_interval_ns" 'BEGIN { if (remaining < interval) remaining = interval; printf "%.3f", remaining / 1000000000 }')"
              sleep "$sleep_seconds"
              memory_sample="$(read_memory_current_bytes)"
              if [ -z "$memory_sample" ]; then
                printf '%s\n' 'resource sample failed: memory.current became empty during sampling'
                exit 1
              fi
              require_uint memory_peak_sample_bytes "$memory_sample"
              if [ "$memory_sample" -gt "$memory_peak" ]; then
                memory_peak="$memory_sample"
              fi
            done
            end_cpu="$(read_cpu_usec)"
            end_ns="$(date +%s%N)"
            end_memory_current="$(read_memory_current_bytes)"
            if [ -z "$end_cpu" ] || [ -z "$end_memory_current" ]; then
              printf '%s\n' 'resource sample failed: cgroup counters became empty'
              exit 1
            fi
            require_uint end_cpu_usec "$end_cpu"
            require_uint end_memory_current_bytes "$end_memory_current"
            if [ "$end_cpu" -lt "$start_cpu" ]; then
              printf 'resource sample failed: CPU counter decreased from %s to %s\n' "$start_cpu" "$end_cpu"
              exit 1
            fi
            if [ -n "$previous_end_cpu" ] && [ "$start_cpu" -lt "$previous_end_cpu" ]; then
              printf 'resource sample failed: CPU counter reset between samples from %s to %s\n' "$previous_end_cpu" "$start_cpu"
              exit 1
            fi
            elapsed_ns=$((end_ns - start_ns))
            if [ "$elapsed_ns" -le 0 ]; then
              printf 'resource sample failed: elapsed interval was not positive: %s\n' "$elapsed_ns"
              exit 1
            fi
            cpu_cores="$(awk -v delta="$((end_cpu - start_cpu))" -v elapsed="$elapsed_ns" 'BEGIN { printf "%.9f", delta * 1000 / elapsed }')"
            if [ "$end_memory_current" -gt "$memory_peak" ]; then
              memory_peak="$end_memory_current"
            fi
            memory_current_mib="$(awk -v bytes="$memory_peak" 'BEGIN { printf "%.6f", bytes / 1048576 }')"
            printf 'sample=%s start_cpu_usec=%s end_cpu_usec=%s start_memory_current_bytes=%s end_memory_current_bytes=%s peak_memory_current_bytes=%s cpu_cores=%s memory_current_mib=%s elapsed_ns=%s\n' \
              "$sample" "$start_cpu" "$end_cpu" "$start_memory_current" "$end_memory_current" "$memory_peak" "$cpu_cores" "$memory_current_mib" "$elapsed_ns"
            if awk -v value="$cpu_cores" -v max="$max_cpu" 'BEGIN { exit !(value > max) }'; then
              max_cpu="$cpu_cores"
            fi
            if awk -v value="$memory_current_mib" -v max="$max_memory_current" 'BEGIN { exit !(value > max) }'; then
              max_memory_current="$memory_current_mib"
            fi
            previous_end_cpu="$end_cpu"
          done
          printf 'scope=real capability-only DaemonSet in kind with %s Pods, %s policies, and %s rules\n' \
            "$expected_pods" "$expected_policies" "$expected_rules"
          printf 'quiet_settle_seconds=10\nsample_interval_seconds=5\nmemory_peak_sample_interval_ms=100\nsamples=3\n'
          printf 'memory_metric=memory.current (conservative cgroup memory upper bound; includes non-RSS charges)\n'
          printf 'max_cpu_cores=%s\nmax_memory_current_mib=%s\n' "$max_cpu" "$max_memory_current"
          printf 'cpu_budget_cores=0.10\nmemory_current_budget_mib=200\n'
          if awk -v value="$max_cpu" 'BEGIN { exit !(value > 0.10) }'; then
            printf '%s\n' 'budget_result=failed'
            exit 1
          fi
          if awk -v value="$max_memory_current" 'BEGIN { exit !(value > 200) }'; then
            printf '%s\n' 'budget_result=failed'
            exit 1
          fi
          printf '%s\n' 'budget_result=passed'
          ) 2>&1 | tee capability-agent-resource.txt

      - name: Measure DaemonSet rolling-update fail-open interval
        run: |
          set -euo pipefail
          (
          set -euo pipefail
          server_ip="$(kubectl -n ztap-smoke get pod smoke-server -o jsonpath='{.status.podIP}')"
          smoke_client_node="$(kubectl -n ztap-smoke get pod smoke-client -o jsonpath='{.spec.nodeName}')"
          old_pods="$(kubectl -n ztap-system get pods -l app=ztap-agent -o json)"
          old_pod="$(jq -r --arg node "$smoke_client_node" '
            [
              .items[]
              | select(.spec.nodeName == $node)
              | select(.status.phase == "Running")
              | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
              | .metadata.name
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$old_pods")"
          old_uid="$(kubectl -n ztap-system get pod "$old_pod" -o jsonpath='{.metadata.uid}')"
          old_node="$(kubectl -n ztap-system get pod "$old_pod" -o jsonpath='{.spec.nodeName}')"
          test -n "$smoke_client_node"
          test -n "$old_pod"
          test -n "$old_uid"
          test -n "$old_node"
          test "$old_node" = "$smoke_client_node"
          baseline_control_response="$(kubectl -n ztap-smoke exec smoke-control -- wget -qO- -T 1 "http://$server_ip:8080/" 2>/dev/null || true)"
          test "$baseline_control_response" = ok
          if kubectl -n ztap-smoke exec smoke-client -- wget -qO- -T 1 "http://$server_ip:8080/" >/dev/null 2>&1; then
            printf '%s\n' 'selected smoke-client was already allowed before the rollout' >&2
            exit 1
          fi
          printf '%s\n' 'baseline_selected_smoke_client=blocked'

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/ztap-rollout-probe" ./tools/phase5probe
          kubectl cp "$RUNNER_TEMP/ztap-rollout-probe" ztap-smoke/smoke-client:/tmp/ztap-rollout-probe -c client
          kubectl -n ztap-smoke exec smoke-client -c client -- chmod 0755 /tmp/ztap-rollout-probe
          kubectl -n ztap-smoke exec smoke-client -c client -- rm -f /tmp/ztap-rollout-probe.stop
          probe_output="$RUNNER_TEMP/rolling-probe.txt"
          : > "$probe_output"
          probe_pid=""
          # ShellCheck cannot see the indirect invocation through the EXIT trap.
          # shellcheck disable=SC2329
          cleanup_rollout_probe() {
            if [ -n "$probe_pid" ]; then
              if timeout 5s kubectl -n ztap-smoke exec smoke-client -c client -- touch /tmp/ztap-rollout-probe.stop >/dev/null 2>&1; then
                wait "$probe_pid" 2>/dev/null || true
              else
                kill "$probe_pid" 2>/dev/null || true
                wait "$probe_pid" 2>/dev/null || true
              fi
            fi
          }
          trap cleanup_rollout_probe EXIT
          kubectl -n ztap-smoke exec smoke-client -c client -- /tmp/ztap-rollout-probe \
            -url "http://$server_ip:8080/" \
            -interval=10ms \
            -request-timeout=100ms \
            -max-duration=5m \
            -stop-file=/tmp/ztap-rollout-probe.stop \
            > "$probe_output" 2>&1 &
          probe_pid=$!
          sleep 0.2
          probe_running=0
          for running_pid in $(jobs -pr); do
            if [ "$running_pid" = "$probe_pid" ]; then
              probe_running=1
            fi
          done
          if [ "$probe_running" -ne 1 ] || [ -s "$probe_output" ]; then
            cat "$probe_output" >&2
            printf '%s\n' 'rolling probe did not remain blocked and running before the rollout' >&2
            exit 1
          fi

          rollout_started_ns="$(date +%s%N)"
          printf 'smoke_client_node=%s\nold_namespace=ztap-system\nold_pod=%s\nold_uid=%s\nold_node=%s\nold_ready=true\nrollout_started_ns=%s\n' \
            "$smoke_client_node" "$old_pod" "$old_uid" "$old_node" "$rollout_started_ns"
          kubectl -n ztap-system rollout restart daemonset/ztap-agent >/dev/null

          fail_open_start_ns=""
          fail_open_end_ns=""
          replacement_pod=""
          replacement_uid=""
          replacement_created_at=""
          replacement_node=""
          replacement_observed_ns=""
          replacement_ready=""
          probe_finished=0
          for ((attempt = 0; attempt < 3600; attempt++)); do
            if [ -z "$replacement_pod" ]; then
              pod_records="$(kubectl -n ztap-system get pods -l app=ztap-agent -o json 2>/dev/null || true)"
              mapfile -t replacement_rows < <(jq -r --arg old_pod "$old_pod" --arg old_node "$old_node" '
                .items[]
                | select(.metadata.name != $old_pod)
                | select(.spec.nodeName == $old_node)
                | select(.status.phase == "Running")
                | [
                    .metadata.name,
                    .metadata.uid,
                    .metadata.creationTimestamp,
                    .spec.nodeName,
                    (any(.status.conditions[]?; .type == "Ready" and .status == "True") | tostring)
                  ]
                | @tsv
              ' <<< "$pod_records" 2>/dev/null || true)
              if [ "${#replacement_rows[@]}" -eq 1 ]; then
                IFS=$'\t' read -r current_pod current_uid current_created_at current_node current_ready <<< "${replacement_rows[0]}"
                replacement_pod="$current_pod"
                replacement_uid="$current_uid"
                replacement_created_at="$current_created_at"
                replacement_node="$current_node"
                replacement_observed_ns="$(date +%s%N)"
                replacement_ready="$current_ready"
              fi
            fi

            if [ -n "$replacement_pod" ] && [ "$replacement_ready" != true ] && [ "$((attempt % 10))" -eq 0 ]; then
              replacement_record="$(kubectl -n ztap-system get pod "$replacement_pod" -o json 2>/dev/null || true)"
              if [ -n "$replacement_record" ]; then
                current_uid="$(jq -r '.metadata.uid' <<< "$replacement_record")"
                if [ "$current_uid" != "$replacement_uid" ]; then
                  printf '%s\n' 'rolling probe failed: replacement Pod identity changed before Ready' >&2
                  exit 1
                fi
                replacement_ready="$(jq -r 'any(.status.conditions[]?; .type == "Ready" and .status == "True") | tostring' <<< "$replacement_record")"
              fi
            fi

            if [ "$((attempt % 10))" -eq 0 ]; then
              control_response="$(kubectl -n ztap-smoke exec smoke-control -- wget -qO- -T 1 "http://$server_ip:8080/" 2>/dev/null || true)"
              if [ "$control_response" != ok ]; then
                printf 'rolling probe failed: unselected control client returned %q\n' "$control_response" >&2
                exit 1
              fi
            fi

            probe_start_count="$(awk -F= '$1 == "fail_open_start_ns" { count++ } END { print count + 0 }' "$probe_output")"
            probe_end_count="$(awk -F= '$1 == "fail_open_end_ns" { count++ } END { print count + 0 }' "$probe_output")"
            if [ "$probe_start_count" -gt 1 ] || [ "$probe_end_count" -gt 1 ]; then
              printf '%s\n' 'rolling probe emitted duplicate fail-open timestamps' >&2
              exit 1
            fi
            if [ "$probe_start_count" -eq 1 ]; then
              fail_open_start_ns="$(awk -F= '$1 == "fail_open_start_ns" { print $2 }' "$probe_output")"
            fi
            if [ "$probe_end_count" -eq 1 ]; then
              fail_open_end_ns="$(awk -F= '$1 == "fail_open_end_ns" { print $2 }' "$probe_output")"
            fi
            if [ -n "$replacement_pod" ] && [ "$replacement_ready" = true ] &&
              [ -n "$fail_open_start_ns" ] && [ -n "$fail_open_end_ns" ]; then
              if [ "$probe_finished" -ne 1 ]; then
                wait "$probe_pid"
                probe_finished=1
              fi
              probe_pid=""
              break
            fi

            if [ "$probe_finished" -ne 1 ]; then
              probe_running=0
              for running_pid in $(jobs -pr); do
                if [ "$running_pid" = "$probe_pid" ]; then
                  probe_running=1
                fi
              done
              if [ "$probe_running" -ne 1 ]; then
                if [ -n "$fail_open_start_ns" ] && [ -n "$fail_open_end_ns" ]; then
                  wait "$probe_pid"
                  probe_finished=1
                elif wait "$probe_pid"; then
                  printf '%s\n' 'rolling probe exited without a complete fail-open interval' >&2
                  exit 1
                else
                  cat "$probe_output" >&2
                  printf '%s\n' 'rolling probe failed before a complete fail-open interval' >&2
                  exit 1
                fi
              fi
            fi

            sleep 0.1
          done

          if [ -n "$probe_pid" ]; then
            if [ "$probe_finished" -eq 1 ]; then
              printf '%s\n' 'fail-open interval was captured, but no Ready replacement agent was observed before the deadline' >&2
            else
              printf '%s\n' 'rolling probe did not finish before the observation deadline' >&2
            fi
            exit 1
          fi

          kubectl -n ztap-system rollout status daemonset/ztap-agent --timeout=180s >/dev/null
          test -n "$replacement_pod"
          test -n "$replacement_uid"
          test -n "$replacement_created_at"
          test -n "$replacement_node"
          test -n "$replacement_observed_ns"
          test "$replacement_ready" = true
          test "$old_uid" != "$replacement_uid"
          test "$old_node" = "$replacement_node"
          test -n "$fail_open_start_ns"
          test -n "$fail_open_end_ns"
          fail_open_ms=$(( (fail_open_end_ns - fail_open_start_ns) / 1000000 ))
          printf 'replacement_namespace=ztap-system\nreplacement_pod=%s\nreplacement_uid=%s\nreplacement_created_at=%s\nreplacement_node=%s\nreplacement_ready=%s\nreplacement_observed_ns=%s\nfail_open_start_ns=%s\nfail_open_end_ns=%s\nfail_open_interval_ms=%s\n' \
            "$replacement_pod" "$replacement_uid" "$replacement_created_at" "$replacement_node" "$replacement_ready" "$replacement_observed_ns" "$fail_open_start_ns" "$fail_open_end_ns" "$fail_open_ms"
          ) 2>&1 | tee rolling-fail-open-evidence.txt

      - name: Exercise live flow reader
        run: |
          set -euo pipefail
          (
          set -euo pipefail
          agent_pods="$(kubectl -n ztap-system get pods -l app=ztap-agent -o json)"
          agent_pod="$(jq -r '
            [
              .items[]
              | select(.status.phase == "Running")
              | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
              | .metadata.name
            ]
            | if length == 1 then .[0] else empty end
          ' <<< "$agent_pods")"
          client_ip="$(kubectl -n ztap-smoke get pod smoke-client -o jsonpath='{.status.podIP}')"
          server_ip="$(kubectl -n ztap-smoke get pod smoke-server -o jsonpath='{.status.podIP}')"
          test -n "$client_ip"
          test -n "$server_ip"
          printf 'flow_expected_src_ip=%s\nflow_expected_dst_ip=%s\nflow_expected_dst_port=8080\n' \
            "$client_ip" "$server_ip"
          flow_output="$RUNNER_TEMP/ztap-flows.json"
          flow_error="$RUNNER_TEMP/ztap-flows.err"
          kubectl -n ztap-system exec "$agent_pod" -- /ztap flows --output json --action blocked --direction egress \
            --bpffs-root=/host/sys/fs/bpf \
            > "$flow_output" 2> "$flow_error" &
          flow_pid=$!
          flow_seen=0
          for ((attempt = 0; attempt < 30; attempt++)); do
            if ! kill -0 "$flow_pid" 2>/dev/null; then
              wait "$flow_pid" || true
              cat "$flow_error" >&2
              exit 1
            fi
            kubectl -n ztap-smoke exec smoke-client -- wget -qO- -T 3 "http://$server_ip:8080/" >/dev/null 2>&1 || true
            if jq -e -s --arg expected_src "$client_ip" --arg expected_dst "$server_ip" '
              any(.[];
                (.timestamp | type) == "string" and
                (.timestamp | length) > 0 and
                (.policy_epoch | type) == "number" and
                (.policy_epoch > 0) and
                ((.policy_epoch | floor) == .policy_epoch) and
                (.cgroup_id | type) == "number" and
                (.cgroup_id > 0) and
                ((.cgroup_id | floor) == .cgroup_id) and
                .action == "blocked" and
                .direction == "egress" and
                .protocol == "TCP" and
                .reason == "default_deny" and
                (.src_ip | type) == "string" and
                .src_ip == $expected_src and
                (.src_port | type) == "number" and
                (.src_port > 0) and
                (.src_port <= 65535) and
                ((.src_port | floor) == .src_port) and
                (.dst_ip | type) == "string" and
                .dst_ip == $expected_dst and
                (.dst_port | type) == "number" and
                .dst_port == 8080 and
                (.schema_version | type) == "number" and
                .schema_version == 1)
            ' "$flow_output" >/dev/null 2>&1; then
              flow_seen=1
              break
            fi
            sleep 1
          done
          kill "$flow_pid" 2>/dev/null || true
          wait "$flow_pid" 2>/dev/null || true
          test "$flow_seen" -eq 1
          cat "$flow_output"
          printf '%s\n' 'flow_streaming=passed'
          ) 2>&1 | tee -a capability-agent-smoke.txt

      - name: Capture Kubernetes diagnostics
        if: always()
        run: |
          {
            kubectl get nodes -o wide || true
            kubectl -n ztap-system get daemonset,pods -o wide || true
            kubectl -n ztap-system describe daemonset/ztap-agent || true
            kubectl -n ztap-system describe pods -l app=ztap-agent || true
            kubectl -n ztap-system logs daemonset/ztap-agent --all-containers=true --tail=1000 || true
            kubectl -n ztap-smoke get pods,networkpolicy -o wide || true
            kubectl -n ztap-performance get pods,networkpolicy -o wide || true
            docker exec ztap-control-plane sh -c 'printf "%s\\n" "--- node cgroup configuration ---"; cat /proc/1/cgroup; grep -E "SystemdCgroup|systemd_cgroup" /etc/containerd/config.toml || true; cat /var/lib/kubelet/config.yaml | grep -E "cgroupDriver" || true; printf "%s\\n" "--- cgroup directories ---"; find /sys/fs/cgroup -maxdepth 8 -type d -print 2>/dev/null | head -n 200 || true; printf "%s\\n" "--- containerd cgroup directories ---"; find /sys/fs/cgroup -maxdepth 8 -type d -name "*cri-containerd*" -print 2>/dev/null | head -n 80 || true'
          } > capability-agent-diagnostics.txt 2>&1

      - name: Upload capability-only agent evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capability-agent-evidence
          path: |
            capability-agent-smoke.txt
            capability-agent-diagnostics.txt
            capability-agent-reference-fixture.txt
            phase5-reference-fixture.yaml
            capability-agent-resource.txt
            rolling-fail-open-evidence.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Delete disposable kind cluster
        if: always()
        run: kind delete cluster --name ztap || true

  build-assets:
    name: Build Assets (Linux)
    runs-on: ubuntu-24.04
    needs: [lint, generated-code]
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native binary
        run: make build

      - name: Exercise the documented runtime-image target
        run: make docker

      - name: Validate retained examples
        run: |
          ./bin/ztap version
          ./bin/ztap --help >/dev/null
          for example in examples/native/*.yaml; do
            printf 'validating %s\n' "$example"
            ./bin/ztap validate --file "$example"
          done
          ./bin/ztap validate --file - < examples/native/default-deny.yaml

      - name: Validate Kubernetes manifest tests
        run: go test ./deployments/kubernetes

      - name: Build arm64 binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          out="$RUNNER_TEMP/ztap-${GOOS}-${GOARCH}"
          go build -o "${out}" ./cmd/ztap
          ls -lh "${out}"

  all-checks:
    name: Required CI
    runs-on: ubuntu-24.04
    needs:
      - lint
      - actionlint
      - zizmor
      - generated-code
      - test-go
      - test-integration
      - docker-build
      - ebpf-verification
      - capability-agent
      - build-assets
      - dependency-review
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check all jobs status
        run: |
          echo "Job Results:"
          echo "  lint: ${NEEDS_LINT_RESULT}"
          echo "  actionlint: ${NEEDS_ACTIONLINT_RESULT}"
          echo "  zizmor: ${NEEDS_ZIZMOR_RESULT}"
          echo "  generated-code: ${NEEDS_GENERATED_CODE_RESULT}"
          echo "  test-go: ${NEEDS_TEST_GO_RESULT}"
          echo "  test-integration: ${NEEDS_TEST_INTEGRATION_RESULT}"
          echo "  docker-build: ${NEEDS_DOCKER_BUILD_RESULT}"
          echo "  ebpf-verification: ${NEEDS_EBPF_VERIFICATION_RESULT}"
          echo "  capability-agent: ${NEEDS_CAPABILITY_AGENT_RESULT}"
          echo "  build-assets: ${NEEDS_BUILD_ASSETS_RESULT}"
          echo "  dependency-review: ${NEEDS_DEPENDENCY_REVIEW_RESULT}"
          echo ""

          required_jobs=(
            "lint:${NEEDS_LINT_RESULT}"
            "actionlint:${NEEDS_ACTIONLINT_RESULT}"
            "zizmor:${NEEDS_ZIZMOR_RESULT}"
            "generated-code:${NEEDS_GENERATED_CODE_RESULT}"
            "test-go:${NEEDS_TEST_GO_RESULT}"
            "test-integration:${NEEDS_TEST_INTEGRATION_RESULT}"
            "docker-build:${NEEDS_DOCKER_BUILD_RESULT}"
            "build-assets:${NEEDS_BUILD_ASSETS_RESULT}"
          )
          for job in "${required_jobs[@]}"; do
            name="${job%%:*}"
            result="${job#*:}"
            if [ "$result" != success ]; then
              echo "$name did not succeed: $result"
              exit 1
            fi
          done

          trusted_event=true
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${EVENT_PR_HEAD_REPOSITORY}" != "${EVENT_REPOSITORY}" ]; then
            trusted_event=false
          fi
          if [ "$trusted_event" = true ]; then
            for job in "ebpf-verification:${NEEDS_EBPF_VERIFICATION_RESULT}" "capability-agent:${NEEDS_CAPABILITY_AGENT_RESULT}"; do
              name="${job%%:*}"
              result="${job#*:}"
              if [ "$result" != success ]; then
                echo "$name did not succeed on a trusted event: $result"
                exit 1
              fi
            done
          else
            echo "Privileged Linux jobs are intentionally skipped for an untrusted fork pull request."
          fi

          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${NEEDS_DEPENDENCY_REVIEW_RESULT}" != success ]; then
            echo "dependency-review did not succeed: ${NEEDS_DEPENDENCY_REVIEW_RESULT}"
            exit 1
          fi
          echo "All required checks passed."
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          NEEDS_LINT_RESULT: ${{ needs.lint.result }}
          NEEDS_ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          NEEDS_ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          NEEDS_GENERATED_CODE_RESULT: ${{ needs.generated-code.result }}
          NEEDS_TEST_GO_RESULT: ${{ needs.test-go.result }}
          NEEDS_TEST_INTEGRATION_RESULT: ${{ needs.test-integration.result }}
          NEEDS_DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          NEEDS_EBPF_VERIFICATION_RESULT: ${{ needs.ebpf-verification.result }}
          NEEDS_CAPABILITY_AGENT_RESULT: ${{ needs.capability-agent.result }}
          NEEDS_BUILD_ASSETS_RESULT: ${{ needs.build-assets.result }}
          NEEDS_DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}

  phase5-performance-preflight:
    name: Phase 5 performance preflight (Linux)
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/streamline-ztap'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Prepare host bpffs
        run: |
          sudo mkdir -p /sys/fs/bpf
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpffs /sys/fs/bpf
          fi

      - name: Run real-cgroup performance harness
        env:
          PHASE5_RUN_ID: preflight-${{ github.run_id }}-${{ github.sha }}
        run: |
          set -euo pipefail
          sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE,PHASE5_RUN_ID taskset --cpu-list 0,1 \
            env GOMAXPROCS=2 make performance 2>&1 | tee phase5-performance.txt

      - name: Restore evidence ownership
        if: always()
        run: |
          for path in .cache dist; do
            if [ -e "$path" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done

      - name: Retain raw preflight results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: phase5-performance-preflight
          path: |
            phase5-performance.txt
            dist/phase5-*.json
          if-no-files-found: warn
          retention-days: 7
