name: Migration CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

on:
  workflow_dispatch:
    inputs:
      run_performance_preflight:
        description: Run hosted Linux performance measurements and verify CI evidence
        type: boolean
        required: false
        default: false
      migration_ci_run_id:
        description: Successful push run ID for this exact commit and branch
        type: string
        required: false
  push:
    branches: [main, codex/streamline-ztap]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: "0 2 * * 1"

jobs:
  # Manual preflight mode validates a successful same-commit CI run instead of duplicating it.
  lint:
    name: Lint & Format Check
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            echo "::error::gofmt would modify files; run 'gofmt -w' locally before pushing"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run govulncheck
        run: make vulncheck

  zizmor:
    name: zizmor (Actions security)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor (pedantic)
        run: pipx run zizmor==1.16.3 --pedantic .github/workflows/

  actionlint:
    name: Actionlint
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run actionlint with shellcheck
        run: |
          shellcheck --version
          shellcheck .github/scripts/*.sh tools/measure-reconciliation.sh
          make actionlint

  generated-code:
    name: Generated eBPF Code
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 make

      - name: Check generated eBPF bindings
        env:
          BPF2GO_CC: clang-18
        run: make check-generated

  test-go:
    name: Go Tests (Linux)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight }}
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -race -timeout 10m

  test-integration:
    name: Integration Tests (Linux)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight }}
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Compile Linux integration-tag tests
        run: go test -run '^$' -timeout=60s -tags=integration ./internal/enforcer/... ./internal/cli/...

      - name: Vet Linux integration-tag packages
        run: go vet -tags=integration ./internal/enforcer/... ./internal/cli/...

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Dependency Review reads metadata for pull requests.

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate

  docker-build:
    name: Docker Build (ztap)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight }}
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Select builder image from the pinned Go version
        id: builder
        run: |
          go_version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          printf 'image=docker.io/library/golang:%s-alpine\n' "$go_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build ztap image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: GO_BUILDER_IMAGE=${{ steps.builder.outputs.image }}
          push: false
          load: true
          tags: ztap:test
          cache-from: type=gha,scope=ztap
          cache-to: type=gha,mode=max,scope=ztap

      - name: Exercise containerized offline validator
        run: docker run --rm -i ztap:test validate --file - < examples/native/default-deny.yaml

      - name: Scan the built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ztap:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  ebpf-verification:
    name: eBPF Verification (Linux)
    runs-on: ubuntu-24.04
    needs: [lint, test-go]
    # Forked PRs cannot run privileged eBPF steps
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate eBPF evidence output paths
        run: |
          set -euo pipefail
          for path in ebpf-engine-tests.txt; do
            if [ -L "$path" ] || [ -e "$path" ]; then
              printf 'eBPF evidence output path must not already exist: %s\n' "$path" >&2
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 make

      - name: Download dependencies
        run: go mod download

      - name: Verify Linux eBPF and agent integration suites
        run: |
          set -euo pipefail
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpffs /sys/fs/bpf
          fi
          printf 'restart_safe_kernel=%s\n' "$(uname -r)" | tee ebpf-engine-tests.txt
          sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE go test -race -count=1 -tags integration -timeout=10m -v ./internal/enforcer/... ./internal/cli/... 2>&1 | tee -a ebpf-engine-tests.txt
          printf '%s\n' 'restart_safe_persistence_gate=passed' 'inherited_guard_feasibility_gate=passed' 'new_workload_guard_kernel_gate=passed' 'ebpf_engine_runtime_gate=passed' >> ebpf-engine-tests.txt

      - name: Upload privileged eBPF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ebpf-engine-evidence
          path: ebpf-engine-tests.txt
          if-no-files-found: error
          retention-days: 14

  capability-agent:
    name: Capability-only Agent (Kubernetes)
    runs-on: ubuntu-24.04
    needs: [lint, test-go]
    # Forked PRs cannot run the host bpffs and eBPF attach steps.
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 35

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate capability-agent evidence output paths
        run: |
          set -euo pipefail
          for path in \
            capability-agent-smoke.txt \
            capability-agent-diagnostics.txt \
            capability-agent-reference-fixture.txt \
            phase5-reference-fixture.yaml \
            capability-agent-resource.txt \
            rolling-fail-open-evidence.txt \
            rolling-continuity-ingress.jsonl \
            rolling-continuity-ingress.jsonl.err \
            rolling-continuity-egress.jsonl \
            rolling-continuity-egress.jsonl.err \
            rolling-compatible-upgrade.json \
            explicit-uninstall-evidence.json \
            restart-guard-evidence; do
            if [ -L "$path" ] || [ -e "$path" ]; then
              printf 'capability-agent evidence output path must not already exist: %s\n' "$path" >&2
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare host bpffs
        run: |
          sudo mkdir -p /sys/fs/bpf
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpffs /sys/fs/bpf
          fi

      - name: Install kind
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install sigs.k8s.io/kind@v0.32.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create disposable Kubernetes cluster
        run: bash .github/scripts/create-kind-cluster.sh

      - name: Load smoke-test image from Docker's official ECR mirror
        run: |
          docker pull public.ecr.aws/docker/library/busybox:1.36.1
          docker tag public.ecr.aws/docker/library/busybox:1.36.1 busybox:1.36.1
          kind load docker-image busybox:1.36.1 --name ztap

      - name: Disable kindnet NetworkPolicy enforcement
        run: bash .github/scripts/disable-kindnet-policy.sh

      - name: Verify reference node pod capacity
        run: |
          set -euo pipefail
          node="$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')"
          pod_capacity="$(kubectl get node "$node" -o jsonpath='{.status.capacity.pods}')"
          pod_cidr="$(kubectl get node "$node" -o jsonpath='{.spec.podCIDR}')"
          printf 'reference_node_pod_capacity=%s\n' "$pod_capacity"
          printf 'reference_node_pod_cidr=%s\n' "$pod_cidr"
          test "$pod_capacity" -ge 300
          test "${pod_cidr##*/}" -eq 23

      - name: Constrain the kind reference node to two CPUs
        run: |
          set -euo pipefail
          docker update --cpus=2 ztap-control-plane
          cpu_max="$(docker exec ztap-control-plane cat /sys/fs/cgroup/cpu.max)"
          printf 'reference_cpu_max=%s\n' "$cpu_max"
          test "$cpu_max" = '200000 100000'

      - name: Build and load the agent image
        run: |
          make docker
          kind load docker-image ztap:dev --name ztap
          # A distinct OCI image with the same compatible binary exercises
          # capability-only image replacement/rollback. The privileged kernel
          # gate separately changes actual BPF tags at directional checkpoints.
          docker build --label org.opencontainers.image.version=restart-compatibility-gate -t ztap:compat-gate .
          kind load docker-image ztap:compat-gate --name ztap

      - name: Exercise the shipped capability-only DaemonSet
        run: bash .github/scripts/verify-capability-smoke.sh

      - name: Create Phase 5 reference fixture
        run: bash .github/scripts/verify-reference-fixture.sh

      - name: Sample capability-only agent resources
        run: bash .github/scripts/verify-agent-resources.sh

      - name: Verify deployed agent TCP continuity during pause, crash, and rollout
        env:
          ZTAP_COMPATIBLE_ROLLBACK_IMAGE: ztap:compat-gate
        run: bash .github/scripts/verify-existing-continuity.sh

      - name: Verify inherited guard during deployed agent outages
        run: bash .github/scripts/verify-restart-guard.sh

      - name: Exercise live flow reader
        run: bash .github/scripts/verify-flow-reader.sh

      - name: Verify explicit enforcement removal
        run: |
          bash .github/scripts/verify-explicit-uninstall.sh
          go run ./tools/phase5verify -restart-dir=.

      - name: Capture Kubernetes diagnostics
        if: always()
        run: |
          {
            kubectl get nodes -o wide || true
            kubectl -n ztap-system get daemonset,pods -o wide || true
            kubectl -n ztap-system describe daemonset/ztap-agent || true
            kubectl -n ztap-system describe pods -l app=ztap-agent || true
            kubectl -n ztap-system logs daemonset/ztap-agent --all-containers=true --tail=1000 || true
            kubectl -n ztap-smoke get pods,networkpolicy -o wide || true
            kubectl -n ztap-performance get pods,networkpolicy -o wide || true
            docker exec ztap-control-plane sh -c 'printf "%s\\n" "--- node cgroup configuration ---"; cat /proc/1/cgroup; grep -E "SystemdCgroup|systemd_cgroup" /etc/containerd/config.toml || true; cat /var/lib/kubelet/config.yaml | grep -E "cgroupDriver" || true; printf "%s\\n" "--- cgroup directories ---"; find /sys/fs/cgroup -maxdepth 8 -type d -print 2>/dev/null | head -n 200 || true; printf "%s\\n" "--- containerd cgroup directories ---"; find /sys/fs/cgroup -maxdepth 8 -type d -name "*cri-containerd*" -print 2>/dev/null | head -n 80 || true'
          } > capability-agent-diagnostics.txt 2>&1

      - name: Upload capability-only agent evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capability-agent-evidence
          path: |
            capability-agent-smoke.txt
            capability-agent-diagnostics.txt
            capability-agent-reference-fixture.txt
            phase5-reference-fixture.yaml
            capability-agent-resource.txt
            rolling-fail-open-evidence.txt
            rolling-continuity-ingress.jsonl
            rolling-continuity-egress.jsonl
            rolling-compatible-upgrade.json
            restart-guard-evidence/
            explicit-uninstall-evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Delete disposable kind cluster
        if: always()
        run: kind delete cluster --name ztap || true

  build-assets:
    name: Build Assets (Linux)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight }}
    runs-on: ubuntu-24.04
    needs: [lint, generated-code]
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native binary
        run: make build

      - name: Validate retained examples
        run: |
          ./bin/ztap version
          ./bin/ztap --help >/dev/null
          for example in examples/native/*.yaml; do
            printf 'validating %s\n' "$example"
            ./bin/ztap validate --file "$example"
          done
          ./bin/ztap validate --file - < examples/native/default-deny.yaml

      - name: Build arm64 binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          out="$RUNNER_TEMP/ztap-${GOOS}-${GOARCH}"
          go build -o "${out}" ./cmd/ztap
          ls -lh "${out}"

  all-checks:
    name: Required CI
    runs-on: ubuntu-24.04
    needs:
      - lint
      - actionlint
      - zizmor
      - generated-code
      - test-go
      - test-integration
      - docker-build
      - ebpf-verification
      - capability-agent
      - build-assets
      - dependency-review
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.run_performance_preflight) }}
    timeout-minutes: 5

    steps:
      - name: Check all jobs status
        run: |
          echo "Job Results:"
          echo "  lint: ${NEEDS_LINT_RESULT}"
          echo "  actionlint: ${NEEDS_ACTIONLINT_RESULT}"
          echo "  zizmor: ${NEEDS_ZIZMOR_RESULT}"
          echo "  generated-code: ${NEEDS_GENERATED_CODE_RESULT}"
          echo "  test-go: ${NEEDS_TEST_GO_RESULT}"
          echo "  test-integration: ${NEEDS_TEST_INTEGRATION_RESULT}"
          echo "  docker-build: ${NEEDS_DOCKER_BUILD_RESULT}"
          echo "  ebpf-verification: ${NEEDS_EBPF_VERIFICATION_RESULT}"
          echo "  capability-agent: ${NEEDS_CAPABILITY_AGENT_RESULT}"
          echo "  build-assets: ${NEEDS_BUILD_ASSETS_RESULT}"
          echo "  dependency-review: ${NEEDS_DEPENDENCY_REVIEW_RESULT}"
          echo ""

          required_jobs=(
            "lint:${NEEDS_LINT_RESULT}"
            "actionlint:${NEEDS_ACTIONLINT_RESULT}"
            "zizmor:${NEEDS_ZIZMOR_RESULT}"
            "generated-code:${NEEDS_GENERATED_CODE_RESULT}"
            "test-go:${NEEDS_TEST_GO_RESULT}"
            "test-integration:${NEEDS_TEST_INTEGRATION_RESULT}"
            "docker-build:${NEEDS_DOCKER_BUILD_RESULT}"
            "build-assets:${NEEDS_BUILD_ASSETS_RESULT}"
          )
          for job in "${required_jobs[@]}"; do
            name="${job%%:*}"
            result="${job#*:}"
            if [ "$result" != success ]; then
              echo "$name did not succeed: $result"
              exit 1
            fi
          done

          trusted_event=true
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${EVENT_PR_HEAD_REPOSITORY}" != "${EVENT_REPOSITORY}" ]; then
            trusted_event=false
          fi
          if [ "$trusted_event" = true ]; then
            for job in "ebpf-verification:${NEEDS_EBPF_VERIFICATION_RESULT}" "capability-agent:${NEEDS_CAPABILITY_AGENT_RESULT}"; do
              name="${job%%:*}"
              result="${job#*:}"
              if [ "$result" != success ]; then
                echo "$name did not succeed on a trusted event: $result"
                exit 1
              fi
            done
          else
            echo "Privileged Linux jobs are intentionally skipped for an untrusted fork pull request."
          fi

          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${NEEDS_DEPENDENCY_REVIEW_RESULT}" != success ]; then
            echo "dependency-review did not succeed: ${NEEDS_DEPENDENCY_REVIEW_RESULT}"
            exit 1
          fi
          echo "All required checks passed."
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          NEEDS_LINT_RESULT: ${{ needs.lint.result }}
          NEEDS_ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          NEEDS_ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          NEEDS_GENERATED_CODE_RESULT: ${{ needs.generated-code.result }}
          NEEDS_TEST_GO_RESULT: ${{ needs.test-go.result }}
          NEEDS_TEST_INTEGRATION_RESULT: ${{ needs.test-integration.result }}
          NEEDS_DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          NEEDS_EBPF_VERIFICATION_RESULT: ${{ needs.ebpf-verification.result }}
          NEEDS_CAPABILITY_AGENT_RESULT: ${{ needs.capability-agent.result }}
          NEEDS_BUILD_ASSETS_RESULT: ${{ needs.build-assets.result }}
          NEEDS_DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}

  performance-preflight:
    name: Hosted performance preflight (Linux)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_performance_preflight }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # Query the successful same-commit CI run and download its evidence.
    env:
      PHASE5_RUN_ID: ${{ github.run_id }}-${{ github.sha }}
      MIGRATION_CI_RUN_ID: ${{ inputs.migration_ci_run_id }}

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the trusted CI run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${MIGRATION_CI_RUN_ID:-}" in
            ''|*[!0-9]*)
              echo 'migration_ci_run_id must be a positive run ID' >&2
              exit 1
              ;;
          esac
          migration_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${MIGRATION_CI_RUN_ID}")"
          jq -e \
            --arg sha "$GITHUB_SHA" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.status == "completed" and
             .conclusion == "success" and
             .event == "push" and
             .head_branch == $branch and
             .head_sha == $sha and
             .path == ".github/workflows/migration-ci.yml" and
             .head_repository.full_name == $repository' \
            <<< "$migration_run" >/dev/null

          require_successful_job() {
            local job_name="$1"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${MIGRATION_CI_RUN_ID}/jobs?per_page=100" |
              jq -e --arg name "$job_name" '
                [.jobs[] | select(
                  .name == $name and
                  .status == "completed" and
                  .conclusion == "success"
                )] | length == 1
              ' >/dev/null
          }
          require_successful_job 'Required CI'
          require_successful_job 'eBPF Verification (Linux)'
          require_successful_job 'Capability-only Agent (Kubernetes)'
          printf 'trusted_source_run=%s\nsource_commit=%s\nsource_branch=%s\n' \
            "$MIGRATION_CI_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF_NAME"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Download trusted Linux evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for path in \
            dist \
            dist/hosted-capability-agent-evidence \
            dist/hosted-ebpf-engine-evidence; do
            if [ -L "$path" ]; then
              printf 'hosted evidence path must not be a symlink: %s\n' "$path" >&2
              exit 1
            fi
            if [ -e "$path" ] && [ ! -d "$path" ]; then
              printf 'hosted evidence path must be a directory: %s\n' "$path" >&2
              exit 1
            fi
          done
          mkdir -p dist/hosted-capability-agent-evidence dist/hosted-ebpf-engine-evidence
          gh run download "$MIGRATION_CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name capability-agent-evidence --dir dist/hosted-capability-agent-evidence
          gh run download "$MIGRATION_CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name ebpf-engine-evidence --dir dist/hosted-ebpf-engine-evidence

      - name: Prepare host bpffs
        run: |
          sudo mkdir -p /sys/fs/bpf
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpffs /sys/fs/bpf
          fi

      - name: Validate fresh measurement output paths
        run: |
          set -euo pipefail
          metric_files=(
            dist/phase5-performance.json
            dist/phase5-flow.json
            dist/phase5-packet.json
            dist/phase5-agent.json
            dist/phase5-agent-reconcile.json
            dist/phase5-agent-event.json
            dist/phase5-agent-pod-start.json
            dist/phase5-agent-restart.json
            dist/phase5-agent-crash.json
            dist/phase5-agent-resource.json
          )
          for path in \
            performance-preflight-environment.txt \
            performance-preflight.log \
            "${metric_files[@]}"; do
            if [ -L "$path" ] || [ -e "$path" ]; then
              printf 'performance output path must not already exist: %s\n' "$path" >&2
              exit 1
            fi
          done

      - name: Record the measurement environment
        run: |
          set -euo pipefail
          GOMAXPROCS=2 go run ./tools/phase5verify record-environment \
            --output performance-preflight-environment.txt \
            --phase5-run-id "$PHASE5_RUN_ID" \
            --migration-ci-run-id "$MIGRATION_CI_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-event "$GITHUB_EVENT_NAME" \
            --workflow-path .github/workflows/migration-ci.yml \
            --migration-ci-branch "$GITHUB_REF_NAME"

      - name: Run real-cgroup performance measurements
        run: |
          set -euo pipefail
          sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE,PHASE5_RUN_ID \
            taskset --cpu-list 0,1 env GOMAXPROCS=2 make performance 2>&1 |
            tee performance-preflight.log

      - name: Restore workspace ownership after privileged measurements
        if: always()
        run: |
          set -euo pipefail
          for path in .cache dist; do
            if [ -e "$path" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done

      - name: Verify measurements and hosted evidence
        run: |
          set -euo pipefail
          make verify-performance \
            PHASE5_EVIDENCE_DIR=dist \
            PHASE5_EXPECTED_RUN_ID="$PHASE5_RUN_ID" \
            PHASE5_ENVIRONMENT_FILE=performance-preflight-environment.txt \
            PHASE5_EXPECTED_MIGRATION_RUN_ID="$MIGRATION_CI_RUN_ID" \
            PHASE5_EXPECTED_COMMIT="$GITHUB_SHA" \
            PHASE5_EXPECTED_REF="$GITHUB_REF" \
            PHASE5_EXPECTED_WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
            PHASE5_EXPECTED_WORKFLOW_EVENT=workflow_dispatch \
            PHASE5_EXPECTED_WORKFLOW_PATH=.github/workflows/migration-ci.yml \
            PHASE5_EXPECTED_MIGRATION_BRANCH="$GITHUB_REF_NAME" \
            PHASE5_EXPECTED_ENVIRONMENT_ARCH=amd64 \
            PHASE5_HOSTED_EBPF_DIR=dist/hosted-ebpf-engine-evidence \
            PHASE5_HOSTED_CAPABILITY_DIR=dist/hosted-capability-agent-evidence

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-performance-preflight-evidence
          path: |
            performance-preflight-environment.txt
            performance-preflight.log
            dist/phase5-performance.json
            dist/phase5-flow.json
            dist/phase5-packet.json
            dist/phase5-agent.json
            dist/phase5-agent-reconcile.json
            dist/phase5-agent-event.json
            dist/phase5-agent-pod-start.json
            dist/phase5-agent-restart.json
            dist/phase5-agent-crash.json
            dist/phase5-agent-resource.json
            dist/hosted-capability-agent-evidence
            dist/hosted-ebpf-engine-evidence
          if-no-files-found: error
          retention-days: 14
