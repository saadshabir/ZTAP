name: Security

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/dependabot.yml"
  pull_request:
    # Run lightweight security checks on PRs; heavy checks run on main only
    types: [opened, synchronize, reopened]
  schedule:
    # Weekly security sweep (Monday 03:00 UTC)
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  security:
    name: Govulncheck + Gosec (light)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZTAP_SECURITY_SKIP_TESTS: "1"
      ZTAP_SECURITY_SKIP_VET: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go vulnerability check
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.8 ./...

  security-deep:
    name: Trivy + SARIF upload (main only)
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan and upload SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: trivy-results.sarif
