name: Phase 0 Feasibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      kubernetes_version:
        description: Kubernetes node image tag to characterize
        required: true
        default: v1.36.4
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false
  BPF2GO_CC: clang-18
  BPF_CLANG: clang-18

jobs:
  reference-fixture:
    name: v0.1.0 reference fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate and verify reference fixture
        run: |
          sh scripts/phase0_reference_fixture.sh --output phase0-reference-fixture --force
          test "$(grep -c '^kind: Pod$' phase0-reference-fixture/workloads.yaml)" -eq 250
          test "$(grep -c '^kind: NetworkPolicy$' phase0-reference-fixture/policies.yaml)" -eq 25
          test "$(grep -c '^    - to:$' phase0-reference-fixture/policies.yaml)" -eq 2500
          grep -Fx 'expected_compiled_local_rule_count=2500' phase0-reference-fixture/metadata.env
          grep -Fx 'fixture_version=v0.1.0' phase0-reference-fixture/metadata.env
          diff -u testdata/phase0-v0.1.0/manifest.sha256 phase0-reference-fixture/manifest.sha256
          test "$(wc -l < phase0-reference-fixture/manifest.sha256)" -eq 2

      - name: Upload reference fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase0-v0.1.0-reference-fixture
          path: phase0-reference-fixture
          retention-days: 14

  kernel-characterization:
    name: Linux eBPF characterization
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 make

      - name: Capture Linux host prerequisites
        run: |
          {
            uname -a
            id
            printf '%s\n' '--- /proc/self/cgroup ---'
            cat /proc/self/cgroup
            printf '%s\n' '--- /proc/self/mountinfo (cgroup/bpf) ---'
            awk '$5 == "/sys/fs/cgroup" || $5 == "/sys/fs/bpf" || $0 ~ / - (cgroup2|bpf) /' /proc/self/mountinfo
            printf '%s\n' '--- cgroup controllers ---'
            cat /sys/fs/cgroup/cgroup.controllers
            printf '%s\n' '--- effective capabilities ---'
            grep '^Cap' /proc/self/status
            printf '%s\n' '--- tools ---'
            command -v clang
            command -v clang-18
            command -v llvm-strip || true
            command -v llvm-strip-18 || true
            command -v bpftool || true
          } | tee phase0-linux-host.txt

      - name: Build eBPF object
        run: make -C bpf CLANG=clang-18

      - name: Check generated eBPF bindings
        run: |
          go generate ./internal/enforcer/...
          git diff --exit-code -- internal/enforcer/bpf_bpfel.go internal/enforcer/bpf_bpfeb.go

      - name: Run kernel characterization tests
        run: |
          set +e
          sudo --preserve-env=PATH,HOME,GOFLAGS,GOMODCACHE,GOCACHE,BPF_CLANG go test -v -timeout=10m -tags=integration ./internal/enforcer -run 'TestEBPFIntegration|TestEBPFGracefulReload' 2>&1 | tee phase0-kernel-tests.txt
          test_status=${PIPESTATUS[0]}
          printf 'test_status=%s\n' "$test_status" | tee -a phase0-kernel-tests.txt
          exit "$test_status"

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase0-linux-evidence
          path: |
            phase0-linux-host.txt
            phase0-kernel-tests.txt
          if-no-files-found: warn
          retention-days: 14

  kubernetes-characterization:
    name: Kubernetes runtime and capability characterization
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install sigs.k8s.io/kind@v0.32.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          kind version
          kubectl version --client

      - name: Create disposable Kubernetes cluster
        env:
          KIND_CLUSTER: ztap-phase0
          KUBERNETES_VERSION: ${{ inputs.kubernetes_version || 'v1.36.4' }}
        run: kind create cluster --name "$KIND_CLUSTER" --config deployments/kubernetes/phase0-kind-config.yaml --image "kindest/node:${KUBERNETES_VERSION}" --wait 180s

      - name: Characterize runtime and capability-only DaemonSet
        env:
          KIND_CLUSTER: ztap-phase0
        run: |
          set +e
          {
            kubectl version -o yaml
            kubectl get nodes -o wide
            kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" runtime="}{.status.nodeInfo.containerRuntimeVersion}{" kernel="}{.status.nodeInfo.kernelVersion}{"\n"}{end}'
            kubectl apply -f deployments/kubernetes/phase0-capability-probe.yaml
            kubectl -n ztap-phase0 rollout status daemonset/capability-probe --timeout=180s
            kubectl -n ztap-phase0 get pods -o wide
            probe_pod="$(kubectl -n ztap-phase0 get pods -l app=ztap-phase0-capability-probe -o jsonpath='{.items[0].metadata.name}')"
            kubectl -n ztap-phase0 exec "$probe_pod" -- sh -c 'id; cat /proc/self/cgroup; grep Cap /proc/self/status; stat -fc %T /host/sys/fs/cgroup; stat -fc %T /host/sys/fs/bpf; mount | grep -E "cgroup|bpf" || true'
            node_container="${KIND_CLUSTER}-control-plane"
            docker exec "$node_container" sh -c 'cat /proc/1/cgroup; grep -E "SystemdCgroup|systemd_cgroup" /etc/containerd/config.toml || true; stat -fc %T /sys/fs/cgroup; stat -fc %T /sys/fs/bpf'
          } 2>&1 | tee phase0-kubernetes.txt
          test_status=${PIPESTATUS[0]}
          printf 'test_status=%s\n' "$test_status" | tee -a phase0-kubernetes.txt
          exit "$test_status"

      - name: Exercise PodIP, ClusterIP, node, self, and lifecycle traffic
        env:
          KIND_CLUSTER: ztap-phase0
        run: |
          set +e
          {
            set -euo pipefail
            docker build --tag ztap:phase0 .
            kind load docker-image ztap:phase0 --name "$KIND_CLUSTER"

            kubectl apply -f deployments/kubernetes/phase0-traffic.yaml
            kubectl -n ztap-phase0 wait --for=condition=Ready pod/phase0-server --timeout=180s
            kubectl -n ztap-phase0 wait --for=condition=Available deployment/phase0-client --timeout=180s
            client_pod="$(kubectl -n ztap-phase0 get pods -l app=phase0-client -o jsonpath='{.items[0].metadata.name}')"
            test -n "$client_pod"
            kubectl -n ztap-phase0 wait --for=condition=Ready pod/"$client_pod" --timeout=180s
            kubectl -n ztap-phase0 wait --for=condition=Ready pod/phase0-node-server --timeout=180s

            server_ip="$(kubectl -n ztap-phase0 get pod phase0-server -o jsonpath='{.status.podIP}')"
            client_ip="$(kubectl -n ztap-phase0 get pod "$client_pod" -o jsonpath='{.status.podIP}')"
            service_ip="$(kubectl -n ztap-phase0 get service phase0-server -o jsonpath='{.spec.clusterIP}')"
            node_ip="$(kubectl get nodes --no-headers -o wide | awk 'NR == 1 { print $6 }')"
            client_container_id="$(kubectl -n ztap-phase0 get pod "$client_pod" -o jsonpath='{.status.containerStatuses[0].containerID}')"
            client_container_id="${client_container_id#*://}"
            client_started_at="$(kubectl -n ztap-phase0 get pod "$client_pod" -o jsonpath='{.status.containerStatuses[0].state.running.startedAt}')"
            client_started_epoch="$(date --date="$client_started_at" +%s)"

            printf 'phase0_fixture server_ip=%s client_ip=%s service_ip=%s node_ip=%s\n' \
              "$server_ip" "$client_ip" "$service_ip" "$node_ip" | tee -a phase0-kubernetes.txt
            printf 'phase0_fixture client_container_id=%s client_started_at=%s client_started_epoch=%s\n' \
              "$client_container_id" "$client_started_at" "$client_started_epoch" | tee -a phase0-kubernetes.txt
            printf '%s\n' '--- CNI and existing NetworkPolicy resources ---' | tee -a phase0-kubernetes.txt
            kubectl -n kube-system get pods -l k8s-app=kindnet -o wide | tee -a phase0-kubernetes.txt
            kubectl -n kube-system get daemonset kindnet -o yaml | tee -a phase0-kubernetes.txt
            kubectl get networkpolicy --all-namespaces | tee -a phase0-kubernetes.txt
            test "$(kubectl get networkpolicy --all-namespaces -o name | wc -l)" -eq 0
            node_container="${KIND_CLUSTER}-control-plane"
            docker exec "$node_container" sh -c '
              printf "%s\\n" "--- CNI configuration ---"
              for cni_file in /etc/cni/net.d/*; do
                if [ -f "$cni_file" ]; then
                  printf "%s\\n" "--- $cni_file ---"
                  cat "$cni_file"
                fi
              done
              printf "%s\\n" "--- node interfaces ---"
              ip addr
              printf "%s\\n" "--- Service NAT rules ---"
              iptables-save -t nat
            ' | tee -a phase0-kubernetes.txt

            sed "s/__CLIENT_CONTAINER_ID__/$client_container_id/g" \
              deployments/kubernetes/phase0-traffic-agent.yaml > "$RUNNER_TEMP/phase0-traffic-agent.yaml"
            kubectl apply -f "$RUNNER_TEMP/phase0-traffic-agent.yaml"
            kubectl -n ztap-phase0 rollout status daemonset/phase0-traffic-observer --timeout=180s
            kubectl -n ztap-phase0 get pods -o wide | tee -a phase0-kubernetes.txt
            observer_pod=''
            for attempt in $(seq 1 90); do
              observer_pod="$(kubectl -n ztap-phase0 get pods -o name 2>/dev/null | awk -F/ '$2 ~ /^phase0-traffic-observer-/ { print $2; exit }' || true)"
              if test -n "$observer_pod"; then
                break
              fi
              sleep 2
            done
            test -n "$observer_pod"
            kubectl -n ztap-phase0 wait --for=condition=Ready pod/"$observer_pod" --timeout=180s

            docker exec "$node_container" sh -c \
              'if ! command -v tcpdump >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y tcpdump; fi'
            docker exec "$node_container" sh -c \
              "tcpdump -i any -nn -tt -c 80 'tcp port 8080 or tcp port 18080 or tcp port 18081 or tcp port 18082'" \
              > phase0-nat.txt 2>&1 &
            capture_pid=$!
            sleep 2

            printf '%s\n' '--- direct PodIP request ---' | tee -a phase0-kubernetes.txt
            kubectl -n ztap-phase0 exec "$client_pod" -c client -- sh -c \
              "printf 'GET / HTTP/1.0\\r\\nHost: phase0-direct\\r\\n\\r\\n' | nc -w 3 -p 30080 $server_ip 8080" | tee -a phase0-kubernetes.txt
            printf '%s\n' '--- ClusterIP request ---' | tee -a phase0-kubernetes.txt
            kubectl -n ztap-phase0 exec "$client_pod" -c client -- sh -c \
              "printf 'GET / HTTP/1.0\\r\\nHost: phase0-service\\r\\n\\r\\n' | nc -w 3 -p 30081 $service_ip 18080" | tee -a phase0-kubernetes.txt
            printf '%s\n' '--- node request ---' | tee -a phase0-kubernetes.txt
            kubectl -n ztap-phase0 exec "$client_pod" -c client -- sh -c \
              "printf 'GET / HTTP/1.0\\r\\nHost: phase0-node\\r\\n\\r\\n' | nc -w 3 -p 30082 $node_ip 18082" | tee -a phase0-kubernetes.txt
            printf '%s\n' '--- self PodIP request ---' | tee -a phase0-kubernetes.txt
            self_request_status=0
            kubectl -n ztap-phase0 exec "$client_pod" -c client -- sh -c \
              "printf 'GET / HTTP/1.0\\r\\nHost: phase0-self\\r\\n\\r\\n' | nc -w 3 -p 30083 $client_ip 18081" > "$RUNNER_TEMP/phase0-self-response.txt" 2>&1 || self_request_status=$?
            cat "$RUNNER_TEMP/phase0-self-response.txt" | tee -a phase0-kubernetes.txt
            printf 'phase0_self_request_status=%s\n' "$self_request_status" | tee -a phase0-kubernetes.txt
            if test "$self_request_status" -ne 0; then
              printf '%s\n' '--- self listener diagnostics ---' | tee -a phase0-kubernetes.txt
              kubectl -n ztap-phase0 exec "$client_pod" -c client -- sh -c \
                'cat /tmp/phase0-self-httpd.log; cat /proc/net/tcp; cat /proc/net/tcp6' | tee -a phase0-kubernetes.txt || true
              printf 'phase0_self_behavior=probe_failed_status_%s\n' "$self_request_status" | tee -a phase0-kubernetes.txt
            fi
            printf '%s\n' '--- rejected IPv6 request ---' | tee -a phase0-kubernetes.txt
            ipv6_request_status=0
            kubectl -n ztap-phase0 exec "$client_pod" -c client -- sh -c \
              'wget -qO- -T 3 -t 1 "http://[::1]:18081/"' > "$RUNNER_TEMP/phase0-ipv6-response.txt" 2>&1 || ipv6_request_status=$?
            cat "$RUNNER_TEMP/phase0-ipv6-response.txt" | tee -a phase0-kubernetes.txt
            printf 'phase0_ipv6_request_status=%s\n' "$ipv6_request_status" | tee -a phase0-kubernetes.txt

            sleep 2
            kill "$capture_pid" 2>/dev/null || true
            wait "$capture_pid" 2>/dev/null || true
            printf '%s\n' '--- observer timing ---' | tee -a phase0-kubernetes.txt
            kubectl -n ztap-phase0 exec "$observer_pod" -- cat /run/ztap-phase0/timing.log | tee -a phase0-kubernetes.txt
            agent_started_epoch="$(kubectl -n ztap-phase0 exec "$observer_pod" -- cat /run/ztap-phase0/timing.log | sed -n 's/.*phase0_agent_started_epoch=\([0-9][0-9]*\).*/\1/p' | head -n 1)"
            observed_epoch="$(kubectl -n ztap-phase0 exec "$observer_pod" -- cat /run/ztap-phase0/timing.log | sed -n 's/.*phase0_cgroup_observed_epoch=\([0-9][0-9]*\).*/\1/p' | head -n 1)"
            ready_epoch="$(kubectl -n ztap-phase0 exec "$observer_pod" -- cat /run/ztap-phase0/timing.log | sed -n 's/.*phase0_policy_classified_epoch=\([0-9][0-9]*\).*/\1/p' | head -n 1)"
            test -n "$agent_started_epoch"
            test -n "$observed_epoch"
            test -n "$ready_epoch"
            printf 'phase0_agent_to_cgroup_observation_seconds=%s\n' "$((observed_epoch - agent_started_epoch))" | tee -a phase0-kubernetes.txt
            printf 'phase0_pod_start_to_cgroup_observation_seconds=%s\n' "$((observed_epoch - client_started_epoch))" | tee -a phase0-kubernetes.txt
            printf 'phase0_pod_start_to_policy_classification_seconds=%s\n' "$((ready_epoch - client_started_epoch))" | tee -a phase0-kubernetes.txt

            kubectl -n ztap-phase0 exec "$observer_pod" -- cat /run/ztap-phase0/enforce.log | tee -a phase0-kubernetes.txt
            kubectl -n ztap-phase0 exec "$observer_pod" -- cat /run/ztap-phase0/flows.jsonl > phase0-flow.jsonl
            cat phase0-flow.jsonl | tee -a phase0-kubernetes.txt
            printf '%s\n' '--- node packet capture ---' | tee -a phase0-kubernetes.txt
            cat phase0-nat.txt | tee -a phase0-kubernetes.txt

            grep -F '"src_port":30080' phase0-flow.jsonl | grep -F '"dst_ip":"'"$server_ip"'"'
            if ! grep -F '"src_port":30081' phase0-flow.jsonl > phase0-service-flow.jsonl; then
              printf '%s\n' 'missing ClusterIP request flow event' >&2
              exit 1
            fi
            if grep -F '"dst_ip":"'"$service_ip"'"' phase0-service-flow.jsonl; then
              printf 'phase0_cgroup_clusterip_visibility=pre-nat service_ip=%s\n' "$service_ip"
            elif grep -F '"dst_ip":"'"$server_ip"'"' phase0-service-flow.jsonl; then
              printf 'phase0_cgroup_clusterip_visibility=post-nat backend_ip=%s\n' "$server_ip"
            else
              printf '%s\n' 'ClusterIP request flow did not expose either the Service or backend address' >&2
              exit 1
            fi
            grep -F '"src_port":30082' phase0-flow.jsonl | grep -F '"dst_ip":"'"$node_ip"'"'
            if test "$self_request_status" -eq 0; then
              grep -F '"src_port":30083' phase0-flow.jsonl | grep -F '"dst_ip":"'"$client_ip"'"' | grep -F '"dst_port":18081' | grep -F '"action":"allowed"'
              grep -F '"direction":"ingress"' phase0-flow.jsonl | grep -F '"src_ip":"'"$client_ip"'"' | grep -F '"src_port":18081' | grep -F '"dst_port":30083' | grep -F '"action":"allowed"'
              printf '%s\n' 'phase0_self_behavior=allowed' | tee -a phase0-kubernetes.txt
            elif grep -F '"src_port":30083' phase0-flow.jsonl | grep -F '"dst_ip":"'"$client_ip"'"' | grep -F '"dst_port":18081' | grep -F '"action":"blocked"'; then
              printf '%s\n' 'phase0_self_behavior=blocked_by_ztap' | tee -a phase0-kubernetes.txt
            elif grep -F '"src_port":30083' phase0-flow.jsonl | grep -F '"dst_ip":"'"$client_ip"'"' | grep -F '"dst_port":18081' | grep -F '"action":"allowed"' \
              && grep -F '"src_port":18081' phase0-flow.jsonl | grep -F '"dst_port":30083' | grep -F '"action":"blocked"'; then
              printf '%s\n' 'phase0_self_behavior=reply_blocked_by_ztap' | tee -a phase0-kubernetes.txt
            else
              printf '%s\n' 'phase0_self_behavior=no_matching_flow_event' | tee -a phase0-kubernetes.txt
            fi
            grep -F '"dst_ip":"::1"' phase0-flow.jsonl | grep -F '"dst_port":18081' | grep -F '"action":"blocked"'
            grep -F '"direction":"ingress"' phase0-flow.jsonl
            grep -F '"src_port":8080' phase0-flow.jsonl | grep -F '"dst_port":30080'
            grep -F '"src_port":18080' phase0-flow.jsonl | grep -F '"dst_port":30081'
            grep -F '"src_port":18082' phase0-flow.jsonl | grep -F '"dst_port":30082'
            grep -F '"src_port":18081' phase0-flow.jsonl | grep -F '"dst_port":30083'
            grep -F '"dst_port":30080' phase0-flow.jsonl
            grep -F '"dst_port":30081' phase0-flow.jsonl
            grep -F '"dst_port":30082' phase0-flow.jsonl
            grep -F '"dst_port":30083' phase0-flow.jsonl
            grep -F "$service_ip.18080" phase0-nat.txt
            grep -F "$server_ip.8080" phase0-nat.txt
          } 2>&1 | tee -a phase0-kubernetes.txt
          test_status=${PIPESTATUS[0]}
          printf 'traffic_test_status=%s\n' "$test_status" | tee -a phase0-kubernetes.txt
          exit "$test_status"

      - name: Measure workload restart, agent restart, and DaemonSet rollout
        env:
          KIND_CLUSTER: ztap-phase0
        run: |
          set -euo pipefail
          namespace=ztap-phase0
          observer_prefix='phase0-traffic-observer-'

          observer_pod=''
          for attempt in $(seq 1 90); do
            observer_pod="$(kubectl -n "$namespace" get pods -o name 2>/dev/null | awk -F/ -v prefix="$observer_prefix" '$2 ~ ("^" prefix) { print $2; exit }' || true)"
            if test -n "$observer_pod"; then
              break
            fi
            sleep 2
          done
          test -n "$observer_pod"
          printf '%s\n' '--- initial lifecycle timing ---' | tee phase0-lifecycle.txt
          kubectl -n "$namespace" exec "$observer_pod" -- cat /run/ztap-phase0/timing.log | tee -a phase0-lifecycle.txt

          wait_for_policy_classification() {
            local pod="$1"
            local classified_epoch=''
            for attempt in $(seq 1 90); do
              classified_epoch="$(kubectl -n "$namespace" exec "$pod" -- cat /run/ztap-phase0/timing.log 2>/dev/null \
                | sed -n 's/.*phase0_policy_classified_epoch=\([0-9][0-9]*\).*/\1/p' | head -n 1 || true)"
              if test -n "$classified_epoch"; then
                printf '%s\n' "$classified_epoch"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          client_pod="$(kubectl -n "$namespace" get pods -l app=phase0-client -o jsonpath='{.items[0].metadata.name}')"
          test -n "$client_pod"
          workload_restart_started="$(date +%s)"
          kubectl -n "$namespace" delete pod "$client_pod" --wait=true
          kubectl -n "$namespace" wait --for=condition=Ready pod -l app=phase0-client --timeout=180s
          client_pod="$(kubectl -n "$namespace" get pods -l app=phase0-client -o jsonpath='{.items[0].metadata.name}')"
          test -n "$client_pod"
          restarted_container_id="$(kubectl -n "$namespace" get pod "$client_pod" -o jsonpath='{.status.containerStatuses[0].containerID}')"
          restarted_container_id="${restarted_container_id#*://}"
          restarted_started_at="$(kubectl -n "$namespace" get pod "$client_pod" -o jsonpath='{.status.containerStatuses[0].state.running.startedAt}')"
          restarted_started_epoch="$(date --date="$restarted_started_at" +%s)"
          printf 'phase0_workload_restart_requested_epoch=%s\n' "$workload_restart_started" | tee -a phase0-lifecycle.txt
          printf 'phase0_workload_restart_started_epoch=%s\n' "$restarted_started_epoch" | tee -a phase0-lifecycle.txt
          printf 'phase0_workload_restart_container_id=%s\n' "$restarted_container_id" | tee -a phase0-lifecycle.txt

          kubectl -n "$namespace" set env daemonset/phase0-traffic-observer \
            CLIENT_CONTAINER_ID="$restarted_container_id"
          kubectl -n "$namespace" rollout status daemonset/phase0-traffic-observer --timeout=180s
          observer_pod=''
          for attempt in $(seq 1 90); do
            observer_pod="$(kubectl -n "$namespace" get pods -o name 2>/dev/null | awk -F/ -v prefix="$observer_prefix" '$2 ~ ("^" prefix) { print $2; exit }' || true)"
            if test -n "$observer_pod"; then
              break
            fi
            sleep 2
          done
          test -n "$observer_pod"
          kubectl -n "$namespace" wait --for=condition=Ready pod/"$observer_pod" --timeout=180s
          restarted_classified_epoch="$(wait_for_policy_classification "$observer_pod")"
          test -n "$restarted_classified_epoch"
          printf 'phase0_workload_restart_to_classification_seconds=%s\n' \
            "$((restarted_classified_epoch - restarted_started_epoch))" | tee -a phase0-lifecycle.txt
          kubectl -n "$namespace" exec "$observer_pod" -- cat /run/ztap-phase0/timing.log | tee -a phase0-lifecycle.txt

          agent_restart_started="$(date +%s)"
          kubectl -n "$namespace" delete pod "$observer_pod" --wait=true
          kubectl -n "$namespace" rollout status daemonset/phase0-traffic-observer --timeout=180s
          observer_pod=''
          for attempt in $(seq 1 90); do
            observer_pod="$(kubectl -n "$namespace" get pods -o name 2>/dev/null | awk -F/ -v prefix="$observer_prefix" '$2 ~ ("^" prefix) { print $2; exit }' || true)"
            if test -n "$observer_pod"; then
              break
            fi
            sleep 2
          done
          test -n "$observer_pod"
          kubectl -n "$namespace" wait --for=condition=Ready pod/"$observer_pod" --timeout=180s
          agent_restarted_classified_epoch="$(wait_for_policy_classification "$observer_pod")"
          test -n "$agent_restarted_classified_epoch"
          printf 'phase0_agent_restart_requested_epoch=%s\n' "$agent_restart_started" | tee -a phase0-lifecycle.txt
          printf 'phase0_agent_restart_to_classification_seconds=%s\n' \
            "$((agent_restarted_classified_epoch - agent_restart_started))" | tee -a phase0-lifecycle.txt
          kubectl -n "$namespace" exec "$observer_pod" -- cat /run/ztap-phase0/timing.log | tee -a phase0-lifecycle.txt

          rollout_started="$(date +%s)"
          rollout_token="$(date +%s)"
          kubectl -n "$namespace" patch daemonset/phase0-traffic-observer --type=strategic \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"phase0-rollout\":\"$rollout_token\"}}}}}"
          kubectl -n "$namespace" rollout status daemonset/phase0-traffic-observer --timeout=180s
          observer_pod=''
          for attempt in $(seq 1 90); do
            observer_pod="$(kubectl -n "$namespace" get pods -o name 2>/dev/null | awk -F/ -v prefix="$observer_prefix" '$2 ~ ("^" prefix) { print $2; exit }' || true)"
            if test -n "$observer_pod"; then
              break
            fi
            sleep 2
          done
          test -n "$observer_pod"
          kubectl -n "$namespace" wait --for=condition=Ready pod/"$observer_pod" --timeout=180s
          rollout_classified_epoch="$(wait_for_policy_classification "$observer_pod")"
          test -n "$rollout_classified_epoch"
          printf 'phase0_daemonset_rollout_requested_epoch=%s\n' "$rollout_started" | tee -a phase0-lifecycle.txt
          printf 'phase0_daemonset_rollout_to_classification_seconds=%s\n' \
            "$((rollout_classified_epoch - rollout_started))" | tee -a phase0-lifecycle.txt
          kubectl -n "$namespace" exec "$observer_pod" -- cat /run/ztap-phase0/timing.log | tee -a phase0-lifecycle.txt

      - name: Delete disposable cluster
        if: always()
        env:
          KIND_CLUSTER: ztap-phase0
        run: kind delete cluster --name "$KIND_CLUSTER"

      - name: Upload Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase0-kubernetes-evidence
          path: |
            phase0-kubernetes.txt
            phase0-flow.jsonl
            phase0-service-flow.jsonl
            phase0-nat.txt
            phase0-lifecycle.txt
          if-no-files-found: warn
          retention-days: 14
