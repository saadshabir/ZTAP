apiVersion: v1
kind: Namespace
metadata:
  name: ztap-phase0
---
apiVersion: v1
kind: Pod
metadata:
  name: phase0-server
  namespace: ztap-phase0
  labels:
    app: phase0-server
spec:
  containers:
    - name: server
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          mkdir -p /www
          printf 'phase0-server\n' > /www/index.html
          exec httpd -f -p 8080 -h /www
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: phase0-server
  namespace: ztap-phase0
spec:
  selector:
    app: phase0-server
  ports:
    - name: http
      port: 18080
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: phase0-client
  namespace: ztap-phase0
  labels:
    app: phase0-client
spec:
  containers:
    - name: client
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          mkdir -p /www
          printf 'phase0-self\n' > /www/index.html
          httpd -f -p 18081 -h /www >/tmp/phase0-self-httpd.log 2>&1 &
          exec sleep 3600
      ports:
        - name: self-http
          containerPort: 18081
      readinessProbe:
        httpGet:
          path: /
          port: self-http
        periodSeconds: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: phase0-node-server
  namespace: ztap-phase0
  labels:
    app: phase0-node-server
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  containers:
    - name: server
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          mkdir -p /www
          printf 'phase0-node\n' > /www/index.html
          exec httpd -f -p 18082 -h /www
      ports:
        - name: node-http
          containerPort: 18082
