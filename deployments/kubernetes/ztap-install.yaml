---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztap-operator
  namespace: ztap-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ztap-operator-leader-election
  namespace: ztap-system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ztap-operator-leader-election
  namespace: ztap-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ztap-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: ztap-operator
    namespace: ztap-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ztap-operator
rules:
  - apiGroups:
      - ztap.io
    resources:
      - ztapnetworkpolicies
      - ztapnetworkpolicies/status
      - ztapnetworkpolicies/finalizers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ztap-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ztap-operator
subjects:
  - kind: ServiceAccount
    name: ztap-operator
    namespace: ztap-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztap-operator
  namespace: ztap-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ztap-operator
  template:
    metadata:
      labels:
        app: ztap-operator
    spec:
      serviceAccountName: ztap-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: manager
          image: ztap-operator:latest
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ztap-operator
  namespace: ztap-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ztap-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztap-agent
  namespace: ztap-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ztap-agent
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ztap-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ztap-agent
subjects:
  - kind: ServiceAccount
    name: ztap-agent
    namespace: ztap-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ztap-agent
  namespace: ztap-system
spec:
  selector:
    matchLabels:
      app: ztap-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: ztap-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: ztap-agent
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: agent
          image: ztap:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - agent
            - --node-name=$(NODE_NAME)
            - --cgroup-root=/host/sys/fs/cgroup
            - --bpffs-root=/host/sys/fs/bpf
            - --run-dir=/run/ztap
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - BPF
                - NET_ADMIN
                - PERFMON
                - SYS_RESOURCE
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: cgroup
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: bpffs
              mountPath: /host/sys/fs/bpf
            - name: run-dir
              mountPath: /run/ztap
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: run-dir
          hostPath:
            path: /run/ztap
            type: DirectoryOrCreate
